<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHM 102 Inorganic Chemistry – Question Bank</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f7f4;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dcdcd5;--accent:#1f4f8f;--accent-t:#fff;--ok:#1f7a45;--ok-bg:#e3f3e8;--bad:#b3261e;--bad-bg:#fbe7e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#202220;--text:#ecece7;--muted:#9a9a93;--line:#363833;--accent:#6aa3ee;--accent-t:#0b1626;--ok:#6fd49a;--ok-bg:#1b3326;--bad:#ff8a80;--bad-bg:#3b1f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#202220;--text:#ecece7;--muted:#9a9a93;--line:#363833;--accent:#6aa3ee;--accent-t:#0b1626;--ok:#6fd49a;--ok-bg:#1b3326;--bad:#ff8a80;--bad-bg:#3b1f1d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;line-height:1.3;margin:8px 0 10px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.list .btn{text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.list .btn small{font-weight:400;color:var(--muted);white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.slide{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font:inherit;cursor:pointer;min-height:44px}
.opt b{flex:none;width:2em}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--text)}
.exp{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:14px}.nav .btn{flex:1}
.score{font-size:2.4rem;font-weight:700;margin:4px 0}
.rev{border-top:1px solid var(--line);padding:10px 0}.rev:first-child{border-top:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bad-bg);color:var(--bad)}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA = {"sections": ["Section 1: Hybridization", "Section 2: VSEPR Theory", "Section 3: Atomic Structure and Electronic Configuration", "Section 4: Periodicity – Building Up of the Periodic Table", "Section 5: Properties of the Groups", "Section 6: Periodic Variations in Element Properties", "Section 7: Comparative Chemistry of Groups IA, IIA and IVA", "Section 8: Introduction to Transition Metal Chemistry", "Section 9: Extraction of Metals", "Section 10: Introduction to Nuclear Chemistry"], "qs": [{"n": 1, "q": "The mixing of atomic orbitals of similar energies to form an equal number of new orbitals of identical shape and energy is called:", "o": [["A", "Resonance"], ["B", "Ionization"], ["C", "Hybridization"], ["D", "Polarization"]], "a": "C", "e": "Slide: this phenomenon is known as hybridization.", "sec": "Section 1: Hybridization"}, {"n": 2, "q": "The new orbitals formed during hybridization are called:", "o": [["A", "Hybrid orbitals"], ["B", "Molecular orbitals"], ["C", "Degenerate orbitals"], ["D", "Antibonding orbitals"]], "a": "A", "e": "Slide: the new orbitals so formed are called hybrid orbitals.", "sec": "Section 1: Hybridization"}, {"n": 3, "q": "Hybridization takes place by reshuffling of:", "o": [["A", "only filled orbitals in the ground state"], ["B", "all or some of the atomic orbitals in the excited state"], ["C", "the nuclei of bonding atoms"], ["D", "only inner-shell orbitals"]], "a": "B", "e": "Slide: reshuffling of all or some of the atomic orbitals in the excited state.", "sec": "Section 1: Hybridization"}, {"n": 4, "q": "Which statement about hybrid orbitals is correct?", "o": [["A", "They differ in energy"], ["B", "They have different sizes"], ["C", "They have the same shape, size and energy, i.e. they are equivalent"], ["D", "They have no s character"]], "a": "C", "e": "Slide: hybrid orbitals have the same shape, size and energy; they are equivalent to each other.", "sec": "Section 1: Hybridization"}, {"n": 5, "q": "The number of hybrid orbitals formed equals:", "o": [["A", "the number of valence electrons"], ["B", "the number of reshuffled pure atomic orbitals"], ["C", "the number of lone pairs"], ["D", "the atomic number"]], "a": "B", "e": "Slide: number of hybrid orbitals = number of reshuffled pure atomic orbitals.", "sec": "Section 1: Hybridization"}, {"n": 6, "q": "Compared with pure atomic orbitals, the shape, size, orientation and energy of hybrid orbitals are:", "o": [["A", "the same"], ["B", "different"], ["C", "the same except energy"], ["D", "the same except shape"]], "a": "B", "e": "Slide: they are different from the pure atomic orbitals.", "sec": "Section 1: Hybridization"}, {"n": 7, "q": "The labels given to hybrid orbitals reflect:", "o": [["A", "the contributing atomic orbitals"], ["B", "the bond angle"], ["C", "the number of electrons"], ["D", "the molecular shape"]], "a": "A", "e": "Slide: labels reflect the contributing atomic orbitals.", "sec": "Section 1: Hybridization"}, {"n": 8, "q": "An sp hybrid orbital possesses:", "o": [["A", "more s than p character"], ["B", "more p than s character"], ["C", "equal amounts of s and p character"], ["D", "only p character"]], "a": "C", "e": "Slide: an sp hybrid orbital possesses equal amounts of s and p orbital character.", "sec": "Section 1: Hybridization"}, {"n": 9, "q": "sp-hybridization is the combination of:", "o": [["A", "one s and one p orbital to give two hybrid orbitals"], ["B", "one s and two p to give three"], ["C", "two s and one p to give three"], ["D", "one s and three p to give four"]], "a": "A", "e": "Slide: one s + one p → two hybrid orbitals of equal energy.", "sec": "Section 1: Hybridization"}, {"n": 10, "q": "In BeF₂ the sp-hybridized orbitals of Be overlap with half-filled orbitals of two fluorine atoms to give a ____ shape.", "o": [["A", "bent"], ["B", "tetrahedral"], ["C", "linear"], ["D", "trigonal planar"]], "a": "C", "e": "Slide: BeF₂ is linear (F–Be–F, 180°).", "sec": "Section 1: Hybridization"}, {"n": 11, "q": "In the BeF₂ orbital diagram, the excited-state configuration of Be is:", "o": [["A", "2s² 2p⁰"], ["B", "2s¹ 2p¹"], ["C", "2s⁰ 2p²"], ["D", "2s¹ 2p²"]], "a": "B", "e": "Slide: ground state 2s²; one electron is promoted to 2p, then the s and p mix to give two sp orbitals.", "sec": "Section 1: Hybridization"}, {"n": 12, "q": "sp²-hybridization is the combination of:", "o": [["A", "one s and one p"], ["B", "two s and one p"], ["C", "one s and two p to give three hybrid orbitals"], ["D", "one s and three p"]], "a": "C", "e": "Slide: one s + two p → three sp² hybrid orbitals of equal energy.", "sec": "Section 1: Hybridization"}, {"n": 13, "q": "In BF₃ the sp² orbitals are oriented at ____ and the molecule is ____.", "o": [["A", "90°, square planar"], ["B", "109°28′, tetrahedral"], ["C", "120°, trigonal planar"], ["D", "180°, linear"]], "a": "C", "e": "Slide: three σ-bonds with bond angle 120°; BF₃ is trigonal planar.", "sec": "Section 1: Hybridization"}, {"n": 14, "q": "In the BF₃ orbital diagram, the dotted lines indicate:", "o": [["A", "lone pairs on boron"], ["B", "electrons shared with F atoms"], ["C", "empty orbitals"], ["D", "π-bonds"]], "a": "B", "e": "Slide: dotted lines indicate the electrons shared with F atoms.", "sec": "Section 1: Hybridization"}, {"n": 15, "q": "sp³-hybridization is the combination of:", "o": [["A", "one s and one p"], ["B", "one s and two p"], ["C", "one s and three p to give four hybrid orbitals"], ["D", "one s, three p and one d"]], "a": "C", "e": "Slide: one s + three p → four sp³ hybrid orbitals. Example: CH₄.", "sec": "Section 1: Hybridization"}, {"n": 16, "q": "The sp³ orbitals of carbon are oriented at 109°28′ and overlap with four H 1s orbitals to give a CH₄ molecule that is:", "o": [["A", "square planar"], ["B", "trigonal pyramidal"], ["C", "symmetrical tetrahedral"], ["D", "linear"]], "a": "C", "e": "Slide: a symmetrical tetrahedral CH₄ molecule forms.", "sec": "Section 1: Hybridization"}, {"n": 17, "q": "Before sp³ hybridization in CH₄, the excited-state configuration of carbon is:", "o": [["A", "2s² 2p²"], ["B", "2s¹ 2p³"], ["C", "2s⁰ 2p⁴"], ["D", "2s² 2p³"]], "a": "B", "e": "Slide: ground state 2s² 2p²; one 2s electron is promoted, giving four unpaired electrons.", "sec": "Section 1: Hybridization"}, {"n": 18, "q": "The combination of one s, three p and one d orbital to form five hybrid orbitals is called sp³d hybridization. Which molecule is an example?", "o": [["A", "SF₆"], ["B", "PCl₅"], ["C", "BF₃"], ["D", "CH₄"]], "a": "B", "e": "Slide: example is the PCl₅ molecule.", "sec": "Section 1: Hybridization"}, {"n": 19, "q": "Ground-state phosphorus is 3s² 3p³. In the excited state used for PCl₅ it is:", "o": [["A", "3s¹ 3p³ 3d¹"], ["B", "3s² 3p² 3d¹"], ["C", "3s¹ 3p² 3d²"], ["D", "3s² 3p³ 3d⁰"]], "a": "A", "e": "Slide: one 3s electron is promoted to 3d; the s, three p and one d orbitals then mix into five sp³d orbitals.", "sec": "Section 1: Hybridization"}, {"n": 20, "q": "The combination of one s, three p and two d orbitals gives how many hybrid orbitals of equal energy?", "o": [["A", "4"], ["B", "5"], ["C", "6"], ["D", "7"]], "a": "C", "e": "Slide: six hybrid orbitals, called sp³d² hybridization.", "sec": "Section 1: Hybridization"}, {"n": 21, "q": "In the SF₆ orbital diagram, the note says the longer arrow is from:", "o": [["A", "sulphur"], ["B", "fluorine"], ["C", "a lone pair"], ["D", "a π-bond"]], "a": "B", "e": "Slide: SF₆ is the sp³d² example; the longer arrow represents the electron from F.", "sec": "Section 1: Hybridization"}, {"n": 22, "q": "VSEPR theory proposes that the stereochemistry of an atom in a molecule is determined primarily by:", "o": [["A", "the nuclear charge"], ["B", "repulsive interactions among all electron pairs in its valence shell"], ["C", "the number of neutrons"], ["D", "ionization energy"]], "a": "B", "e": "Slide: definition of Valence Shell Electron Pair Repulsion theory.", "sec": "Section 2: VSEPR Theory"}, {"n": 23, "q": "According to VSEPR, the shape of a molecule is determined by repulsion between:", "o": [["A", "only bond pairs"], ["B", "only lone pairs"], ["C", "all electron pairs present in the valence shell"], ["D", "core electrons"]], "a": "C", "e": "Slide, first postulate.", "sec": "Section 2: VSEPR Theory"}, {"n": 24, "q": "A lone pair takes up more space around the central atom than a bond pair because:", "o": [["A", "it is attracted to one nucleus while a bond pair is shared by two nuclei"], ["B", "it has more electrons"], ["C", "it is farther from all nuclei"], ["D", "it has a larger charge"]], "a": "A", "e": "Slide: lone pair is attracted to one nucleus; bond pair is shared by two.", "sec": "Section 2: VSEPR Theory"}, {"n": 25, "q": "The order of repulsive interactions in VSEPR is:", "o": [["A", "BP–BP > LP–BP > LP–LP"], ["B", "LP–BP > LP–LP > BP–BP"], ["C", "LP–LP > LP–BP > BP–BP"], ["D", "LP–LP > BP–BP > LP–BP"]], "a": "C", "e": "Slide: LP–LP > LP–BP > BP–BP.", "sec": "Section 2: VSEPR Theory"}, {"n": 26, "q": "The magnitude of repulsion between bonding pairs depends on:", "o": [["A", "the electronegativity difference between the central metal and the other atoms"], ["B", "atomic mass"], ["C", "the number of isotopes"], ["D", "bond colour"]], "a": "A", "e": "Slide, fourth postulate.", "sec": "Section 2: VSEPR Theory"}, {"n": 27, "q": "Which order of repulsion is correct?", "o": [["A", "single > double > triple"], ["B", "triple > double > single"], ["C", "double > triple > single"], ["D", "all equal"]], "a": "B", "e": "Slide: double bonds cause more repulsion than single bonds; triple bonds more than double.", "sec": "Section 2: VSEPR Theory"}, {"n": 28, "q": "Repulsive forces between electron pairs ____ with increasing bond angle.", "o": [["A", "increase sharply"], ["B", "remain constant"], ["C", "decrease sharply"], ["D", "double"]], "a": "C", "e": "Slide: repulsive forces decrease sharply with increasing bond angle.", "sec": "Section 2: VSEPR Theory"}, {"n": 29, "q": "In methane, carbon is ____ hybridized, and all H–C–H angles are about:", "o": [["A", "sp², 120°"], ["B", "sp³, 109.5°"], ["C", "sp, 180°"], ["D", "sp³d, 90°"]], "a": "B", "e": "Slide: four sp³ orbitals each overlap a half-filled H 1s orbital; all H–C–H angles are 109.5°.", "sec": "Section 2: VSEPR Theory"}, {"n": 30, "q": "In ethane, the C–C sigma bond forms by overlap of:", "o": [["A", "the remaining sp³ orbital of each carbon"], ["B", "two unhybridized p orbitals"], ["C", "two sp orbitals"], ["D", "s orbitals of hydrogen"]], "a": "A", "e": "Slide: three sp³ orbitals of each C overlap H 1s orbitals (six C–H bonds); the remaining sp³ orbital of each C overlaps to form the C–C bond.", "sec": "Section 2: VSEPR Theory"}, {"n": 31, "q": "In ethylene each carbon atom is:", "o": [["A", "sp³ hybridized"], ["B", "sp² hybridized, with an unhybridized 2pz orbital that forms a π-bond by sideways overlap"], ["C", "sp hybridized"], ["D", "unhybridized"]], "a": "B", "e": "Slide: bonding in ethylene (ethene).", "sec": "Section 2: VSEPR Theory"}, {"n": 32, "q": "In acetylene, the carbon atoms are sp hybridized, and the two unhybridized 2p orbitals on each carbon overlap sideways to form:", "o": [["A", "one π-bond"], ["B", "two π-bonds"], ["C", "three σ-bonds"], ["D", "no bond"]], "a": "B", "e": "Slide: the remaining unhybridised 2py and 2pz orbitals form two π-bonds.", "sec": "Section 2: VSEPR Theory"}, {"n": 33, "q": "The molecular geometry of an sp³ hybridized molecule such as CH₄ is:", "o": [["A", "linear"], ["B", "planar trigonal"], ["C", "tetrahedral"], ["D", "octahedral"]], "a": "C", "e": "Slide, Table 1: sp³ → tetrahedral (CH₄).", "sec": "Section 2: VSEPR Theory"}, {"n": 34, "q": "The geometry of sp² hybridized molecules (examples C₂H₄, BCl₃) is:", "o": [["A", "tetrahedral"], ["B", "linear"], ["C", "planar trigonal"], ["D", "bent"]], "a": "C", "e": "Slide, Table 1.", "sec": "Section 2: VSEPR Theory"}, {"n": 35, "q": "Hybridization of type sp (examples C₂H₂, BeH₂) gives a ____ geometry.", "o": [["A", "linear"], ["B", "tetrahedral"], ["C", "planar trigonal"], ["D", "octahedral"]], "a": "A", "e": "Slide, Table 1.", "sec": "Section 2: VSEPR Theory"}, {"n": 36, "q": "Which molecule has the shortest C–C bond (Å)?", "o": [["A", "ethane, 1.54"], ["B", "ethene, 1.33"], ["C", "ethyne, 1.20"], ["D", "all equal"]], "a": "C", "e": "Slide: ethyne (sp), 1.20 Å, is the shortest.", "sec": "Section 2: VSEPR Theory"}, {"n": 37, "q": "The C–C bond strength (kcal/mol) increases in the order:", "o": [["A", "ethyne < ethene < ethane"], ["B", "ethane (88) < ethene (152) < ethyne (200)"], ["C", "ethene < ethane < ethyne"], ["D", "all are equal"]], "a": "B", "e": "Slide, Table 2.", "sec": "Section 2: VSEPR Theory"}, {"n": 38, "q": "The C–H bond in ethyne is ____ and ____ than in ethane.", "o": [["A", "longer, weaker"], ["B", "shorter (1.06 Å), stronger (131 kcal/mol)"], ["C", "shorter, weaker"], ["D", "equal in both"]], "a": "B", "e": "Slide, Table 2: ethane C–H 1.10 Å, 101; ethyne C–H 1.06 Å, 131.", "sec": "Section 2: VSEPR Theory"}, {"n": 39, "q": "The bond angles of ethane, ethene and ethyne are respectively:", "o": [["A", "180°, 120°, 109.5°"], ["B", "109.5°, 120°, 180°"], ["C", "120°, 109.5°, 180°"], ["D", "109.5°, 180°, 120°"]], "a": "B", "e": "Slide, Table 2: sp³ 109.5°, sp² 120°, sp 180°.", "sec": "Section 2: VSEPR Theory"}, {"n": 40, "q": "When comparing C–C single, double and triple bonds, the more bonds holding two carbon atoms together:", "o": [["A", "the longer and weaker the bond"], ["B", "the shorter and stronger the C–C bond"], ["C", "the weaker only"], ["D", "no change"]], "a": "B", "e": "Slide, as stated.", "sec": "Section 2: VSEPR Theory"}, {"n": 41, "q": "In hybridization, the shorter and stronger bond results from greater:", "o": [["A", "p character"], ["B", "d character"], ["C", "s character, because an s orbital is closer to the nucleus than a p orbital"], ["D", "lone pairs"]], "a": "C", "e": "Slide, as stated.", "sec": "Section 2: VSEPR Theory"}, {"n": 42, "q": "The C–H bond is shorter and stronger than the C–C sigma bond because:", "o": [["A", "the s orbital of H is closer to the nucleus than the sp³ orbital of carbon, so C and H nuclei are closer together"], ["B", "H is heavier"], ["C", "C–C has more electrons"], ["D", "H has p character"]], "a": "A", "e": "Slide: nuclei are closer in sp³–s overlap than in sp³–sp³ overlap.", "sec": "Section 2: VSEPR Theory"}, {"n": 43, "q": "The bond angle in a molecule depends primarily on its shape. The more s character in an orbital used by carbon to form a bond:", "o": [["A", "the smaller the bond angle"], ["B", "the larger the bond angle"], ["C", "no effect"], ["D", "the longer the bond"]], "a": "B", "e": "Slide: the more s character, the larger the bond angle.", "sec": "Section 2: VSEPR Theory"}, {"n": 44, "q": "The hybridization of a C, O or N atom can be determined by the number of π-bonds it forms. If it forms two π-bonds it is:", "o": [["A", "sp³"], ["B", "sp²"], ["C", "sp"], ["D", "sp³d"]], "a": "C", "e": "Slide: no π-bond → sp³; one π-bond → sp²; two π-bonds → sp.", "sec": "Section 2: VSEPR Theory"}, {"n": 45, "q": "The methyl cation (CH₃⁺) is ____ hybridized and trigonal planar, with:", "o": [["A", "sp³, a lone pair"], ["B", "sp², an empty 2p orbital perpendicular to the plane"], ["C", "sp, two πbonds"], ["D", "sp², an unpaired electron"]], "a": "B", "e": "Slide: three covalent bonds using sp² orbitals; the unhybridized p orbital remains empty.", "sec": "Section 2: VSEPR Theory"}, {"n": 46, "q": "In the methyl radical (CH₃•), carbon is sp² hybridized and the unpaired electron is in:", "o": [["A", "an sp³ orbital"], ["B", "the p orbital"], ["C", "the 1s orbital"], ["D", "an sp orbital"]], "a": "B", "e": "Slide: the half-filled 2p orbital.", "sec": "Section 2: VSEPR Theory"}, {"n": 47, "q": "The methyl anion (CH₃⁻) is ____ hybridized, with the non-bonding pair in an sp³ orbital.", "o": [["A", "sp"], ["B", "sp²"], ["C", "sp³"], ["D", "sp³d"]], "a": "C", "e": "Slide: three sp³ orbitals bond with H; the fourth holds the non-bonding electron pair; four orbitals point to the corners of a tetrahedron.", "sec": "Section 2: VSEPR Theory"}, {"n": 48, "q": "In water, the oxygen atom is:", "o": [["A", "sp hybridized"], ["B", "sp² hybridized"], ["C", "sp³ hybridized, with two orbitals occupied by nonbonding pairs"], ["D", "unhybridized"]], "a": "C", "e": "Slide: each O–H bond forms from an sp³ orbital of O and a 1s of H; the other two sp³ orbitals hold lone pairs.", "sec": "Section 2: VSEPR Theory"}, {"n": 49, "q": "The H–O–H angle in water (104.5°) is slightly smaller than the tetrahedral angle because of:", "o": [["A", "bond-pair/bond-pair repulsion"], ["B", "lone pair–bond pair and lone pair–lone pair repulsion"], ["C", "d-orbital participation"], ["D", "ionic character"]], "a": "B", "e": "Slide: these repulsions reduce the bond angle.", "sec": "Section 2: VSEPR Theory"}, {"n": 50, "q": "The periodicity section of the course outline covers:", "o": [["A", "electronic configuration, periodicity, building up of the periodic table"], ["B", "polymers only"], ["C", "thermodynamics"], ["D", "organic synthesis"]], "a": "A", "e": "Slide: course outlines.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 51, "q": "Matter is anything that:", "o": [["A", "has colour"], ["B", "takes up space and has mass"], ["C", "emits light"], ["D", "conducts electricity"]], "a": "B", "e": "Slide: refresher on the atom.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 52, "q": "Atoms are the ____ of matter, as bricks are of houses.", "o": [["A", "building blocks"], ["B", "products"], ["C", "solvents"], ["D", "fields"]], "a": "A", "e": "Slide: all matter is made of atoms.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 53, "q": "Dalton (1808): each element is made of tiny indivisible particles called atoms that:", "o": [["A", "can be created"], ["B", "can be destroyed"], ["C", "cannot be created nor destroyed (law of conservation of matter)"], ["D", "change into other atoms"]], "a": "C", "e": "Slide, Dalton postulate 1.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 54, "q": "Dalton: in chemical reactions atoms:", "o": [["A", "are converted to other elements"], ["B", "re-combine to form different substances"], ["C", "are destroyed"], ["D", "split in two"]], "a": "B", "e": "Slide: atoms of one element cannot be converted to another; they change how they are bound.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 55, "q": "Dalton: the atoms of a given element are:", "o": [["A", "different from each other"], ["B", "identical, and different from those of any other element"], ["C", "identical to all elements"], ["D", "divisible"]], "a": "B", "e": "Slide, postulate 3.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 56, "q": "Dalton: a given compound always has:", "o": [["A", "variable composition"], ["B", "the same relative numbers and types of atoms"], ["C", "one element only"], ["D", "no atoms"]], "a": "B", "e": "Slide, postulate 4.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 57, "q": "Which was a conclusion of Rutherford (1911–1919)?", "o": [["A", "An atom is a solid sphere"], ["B", "An atom is mostly empty space with a tiny, dense, positively charged nucleus"], ["C", "Atoms are indivisible"], ["D", "Electrons sit in the nucleus"]], "a": "B", "e": "Slide, Rutherford's conclusions.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 58, "q": "Neutrons were added to the model by Chadwick in:", "o": [["A", "1887"], ["B", "1907"], ["C", "1932"], ["D", "1913"]], "a": "C", "e": "Slide: most nuclei also contain a neutral particle, the neutron (with Chadwick, 1932).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 59, "q": "The proton and neutron are found in the ____ while electrons ____ it.", "o": [["A", "orbitals, are in"], ["B", "nucleus, orbit"], ["C", "nucleus, are inside"], ["D", "shell, orbit"]], "a": "B", "e": "Slide: proton (+), neutron (no charge), electron (−).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 60, "q": "The electron was discovered by:", "o": [["A", "Goldstein"], ["B", "Chadwick"], ["C", "J.J. Thomson, Stoney, Lorentz (1887)"], ["D", "Rutherford"]], "a": "C", "e": "Slide table: charge −1.602 × 10⁻¹⁹ C; mass 9.1096 × 10⁻³¹ kg (0.000548 amu).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 61, "q": "The proton has a mass of 1.6726 × 10⁻²⁷ kg (1.00757 amu) and was discovered by:", "o": [["A", "Goldstein, Rutherford (1907)"], ["B", "Chadwick"], ["C", "Thomson"], ["D", "Dalton"]], "a": "A", "e": "Slide table: charge +1.602 × 10⁻¹⁹ C.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 62, "q": "The neutron has a mass of 1.6749 × 10⁻²⁷ kg (1.00893 amu), is neutral, and was discovered by:", "o": [["A", "Rutherford"], ["B", "James Chadwick, 1932"], ["C", "Goldstein"], ["D", "Moseley"]], "a": "B", "e": "Slide table.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 63, "q": "1 amu is approximately:", "o": [["A", "1.66 × 10⁻²⁷ kg"], ["B", "9.11 × 10⁻³¹ kg"], ["C", "1.60 × 10⁻¹⁹ kg"], ["D", "6.02 × 10²³ kg"]], "a": "A", "e": "Slide: 1 amu ≈ 1.66 × 10⁻²⁷ kg.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 64, "q": "In the isotope symbol ᴬ_Z X, the mass number is the number of:", "o": [["A", "protons only"], ["B", "protons + neutrons"], ["C", "electrons"], ["D", "neutrons only"]], "a": "B", "e": "⚠ The slide labels Z as 'protons + neutrons' and A as 'protons'; this is swapped (mass number = protons + neutrons; atomic number = protons).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 65, "q": "Electrons exist in different energy levels or shells. The farther a level is from the nucleus:", "o": [["A", "the less energy it has"], ["B", "the more energy it has"], ["C", "the same energy"], ["D", "it holds no electrons"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 66, "q": "Orbitals are areas within shells where electrons are located; their shapes are represented by the letters:", "o": [["A", "a, b, c, d"], ["B", "s, p, d, f"], ["C", "k, l, m, n"], ["D", "x, y, z, w"]], "a": "B", "e": "Slide: a number before the letter shows the energy level.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 67, "q": "The maximum number of electrons in s, p, d, f orbitals respectively is:", "o": [["A", "1, 3, 5, 7"], ["B", "2, 6, 10, 14"], ["C", "2, 8, 18, 32"], ["D", "2, 4, 6, 8"]], "a": "B", "e": "Slide, orbitals con'td.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 68, "q": "An s orbital is ____ and its radius ____ with increasing n.", "o": [["A", "dumbbell, decreases"], ["B", "spherical, increases"], ["C", "spherical, decreases"], ["D", "four-lobed, increases"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 69, "q": "For a given n, the number of p orbitals is always:", "o": [["A", "1"], ["B", "3"], ["C", "5"], ["D", "7"]], "a": "B", "e": "Slide: always 3 p orbitals for a given n.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 70, "q": "Of the five d orbitals:", "o": [["A", "all have 2 lobes"], ["B", "four have 4 lobes; the other resembles a p orbital with a doughnut around the centre"], ["C", "all are spherical"], ["D", "all have 6 lobes"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 71, "q": "The f sublevel has:", "o": [["A", "3 suborbitals"], ["B", "5 suborbitals"], ["C", "7 suborbitals"], ["D", "9 suborbitals"]], "a": "C", "e": "Slide: f has seven suborbitals (14 electrons).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 72, "q": "The d sublevel has ____ orbitals and holds ____ electrons.", "o": [["A", "3, 6"], ["B", "5, 10"], ["C", "7, 14"], ["D", "1, 2"]], "a": "B", "e": "Slide: sublevel table (s 1/2, p 3/6, d 5/10, f 7/14).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 73, "q": "The energy of atomic orbitals increases as the principal quantum number n increases. Each box (orbital) in the orbital-energy diagram holds:", "o": [["A", "1 electron"], ["B", "2 electrons"], ["C", "6 electrons"], ["D", "10 electrons"]], "a": "B", "e": "Slide: each individual box can hold 2 electrons.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 74, "q": "For a given energy level n, the order of orbital energy is:", "o": [["A", "f < d < p < s"], ["B", "s < p < d < f"], ["C", "p < s < d < f"], ["D", "d < s < p < f"]], "a": "B", "e": "Slide: s lowest, electrons go first; next p; then d.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 75, "q": "In a one-electron hydrogen atom, orbitals on the same energy level have the same energy; that is, they are:", "o": [["A", "hybrid"], ["B", "degenerate"], ["C", "excited"], ["D", "ionic"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 76, "q": "In many-electron atoms, orbitals on the same energy level are no longer degenerate because:", "o": [["A", "electron–electron repulsion increases as electrons increase"], ["B", "the nucleus is lighter"], ["C", "the electrons are paired"], ["D", "n decreases"]], "a": "A", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 77, "q": "Following the filling order 1s², 2s², 2p⁶, 3s², 3p⁶ the next subshell filled is:", "o": [["A", "3d"], ["B", "4s"], ["C", "4p"], ["D", "4d"]], "a": "B", "e": "Slide: ...3p⁶, 4s², 3d¹⁰, 4p⁶, 5s², 4d¹⁰, 5p⁶, 6s², 4f¹⁴, 5d¹⁰, 6p⁶, 7s², 5f¹⁴, 6d¹⁰, 7p⁶.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 78, "q": "In an orbital diagram, an electron is represented by ____ and an atomic orbital by ____.", "o": [["A", "a box, an arrow"], ["B", "an arrow, a box"], ["C", "a circle, a line"], ["D", "a dot, an arrow"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 79, "q": "The Aufbau principle states that electrons:", "o": [["A", "fill orbitals from lowest to highest energy (ascending energy order)"], ["B", "pair up before single occupancy"], ["C", "can share identical quantum numbers"], ["D", "fill highest orbitals first"]], "a": "A", "e": "Slide: in the ground state all electrons are in the lowest possible energy levels.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 80, "q": "Hund's rule of maximum multiplicity states that:", "o": [["A", "electrons must pair up first"], ["B", "single electrons are placed in boxes first and then paired up if necessary"], ["C", "no two electrons are identical"], ["D", "s fills before p"]], "a": "B", "e": "Slide: for degenerate orbitals, lowest energy is attained when the number of electrons with the same spin is maximized.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 81, "q": "Pauli's exclusion principle states that:", "o": [["A", "no two electrons in an atom have identical sets of the four quantum numbers (n, l, m, s)"], ["B", "electrons fill lowest orbitals first"], ["C", "electrons occupy separate boxes first"], ["D", "all electrons have the same spin"]], "a": "A", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 82, "q": "The orbital diagram of nitrogen (1s² 2s² 2p³) shows the three 2p electrons:", "o": [["A", "paired in one box"], ["B", "in three separate boxes with parallel spins"], ["C", "in the 2s box"], ["D", "in the 3s box"]], "a": "B", "e": "Slide example 1 (Hund's rule: single electrons go into boxes first).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 83, "q": "In the orbital diagram of chlorine (1s² 2s² 2p⁶ 3s² 3p⁵), the number of unpaired electrons is:", "o": [["A", "0"], ["B", "1"], ["C", "3"], ["D", "5"]], "a": "B", "e": "Slide example 2: 3p⁵ has two filled boxes and one single electron.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 84, "q": "The orbital diagram of Be is:", "o": [["A", "1s² 2s² with both boxes filled"], ["B", "1s² 2s¹ 2p¹"], ["C", "1s² 2p²"], ["D", "1s¹ 2s²"]], "a": "A", "e": "Be (Z = 4): 1s² 2s² (Aufbau).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 85, "q": "The configuration of K is:", "o": [["A", "[Ar] 4s¹"], ["B", "[Ar] 3d¹"], ["C", "[Ne] 3s¹"], ["D", "[Kr] 5s¹"]], "a": "A", "e": "Slide Group 1A: potassium = 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ = [Ar]4s¹.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 86, "q": "The configuration of Ti is:", "o": [["A", "[Ar] 3d² 4s²"], ["B", "[Ar] 3d⁴"], ["C", "[Ar] 4s² 4p²"], ["D", "[Ne] 3d²"]], "a": "A", "e": "Slide transition-metal table: Ti = [Ar] 3d² 4s².", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 87, "q": "Fe is [Ar] 3d⁶ 4s². For Fe(II) the electrons are lost from:", "o": [["A", "3d"], ["B", "4s"], ["C", "3p"], ["D", "2p"]], "a": "B", "e": "Fe(II) = [Ar] 3d⁶ (the 4s electrons leave first). The slide gives only the Fe configuration; this follows from it.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 88, "q": "In the configuration of helium, 1s², the '2' represents:", "o": [["A", "the energy level"], ["B", "the sublevel"], ["C", "the number of electrons"], ["D", "the number of orbitals"]], "a": "C", "e": "Slide: 1 = energy level, s = sublevel, 2 = number of electrons.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 89, "q": "The electron configuration is similar to ____ for each electron in an atom.", "o": [["A", "a charge"], ["B", "an 'address'"], ["C", "a mass"], ["D", "a spin"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 90, "q": "The electron configuration of oxygen is:", "o": [["A", "1s² 2s² 2p⁴"], ["B", "1s² 2s² 2p⁶"], ["C", "1s² 2s² 2p³"], ["D", "1s² 2s¹ 2p⁵"]], "a": "A", "e": "Slide example 2.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 91, "q": "The electron configuration of iron is:", "o": [["A", "1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁸"], ["B", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶"], ["C", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d⁷"], ["D", "1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4p²"]], "a": "B", "e": "Slide example 3.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 92, "q": "For elements in the d sublevel, the energy level written is:", "o": [["A", "equal to the period number"], ["B", "one number less than the period the element is in"], ["C", "one more than the period"], ["D", "always 1"]], "a": "B", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 93, "q": "The electronic configuration of neon is:", "o": [["A", "1s² 2s² 2p⁶"], ["B", "1s² 2s² 2p⁵"], ["C", "1s² 2s² 2p⁴"], ["D", "1s² 2s² 3s²"]], "a": "A", "e": "Slide exercise (Z = 10).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 94, "q": "The electronic configuration of scandium is:", "o": [["A", "[Ar] 3d¹ 4s²"], ["B", "[Ar] 3d³"], ["C", "[Ar] 4s² 4p¹"], ["D", "[Ne] 3d¹ 4s²"]], "a": "A", "e": "Slide: Sc = [Ar] 3d¹ 4s².", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 95, "q": "The electronic configuration of fluorine is:", "o": [["A", "1s² 2s² 2p⁴"], ["B", "1s² 2s² 2p⁵"], ["C", "1s² 2s² 2p⁶"], ["D", "1s² 2s¹ 2p⁶"]], "a": "B", "e": "Slide exercise (Z = 9).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 96, "q": "Which element has the configuration [Xe] 6s²?", "o": [["A", "Cs"], ["B", "Ba"], ["C", "La"], ["D", "Ra"]], "a": "B", "e": "Slide Group 2A: barium = [Xe]6s².", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 97, "q": "The outermost shell of an atom is the ____ and holds the ____.", "o": [["A", "core shell, core electrons"], ["B", "valence shell, valence electrons"], ["C", "inner shell, bonding pairs"], ["D", "d shell, d electrons"]], "a": "B", "e": "Slide: the electrons that interact most with the rest of the world.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 98, "q": "A full valence shell holds 8 electrons (2 from s, 6 from p), except for:", "o": [["A", "hydrogen and helium, which need only 2"], ["B", "carbon and nitrogen"], ["C", "sodium and potassium"], ["D", "none"]], "a": "A", "e": "Slide.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 99, "q": "The number of valence electrons in oxygen (1s² 2s² 2p⁴) is:", "o": [["A", "4"], ["B", "6"], ["C", "8"], ["D", "2"]], "a": "B", "e": "Slide practice.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 100, "q": "The number of valence electrons in sulfur (1s² 2s² 2p⁶ 3s² 3p⁴) is:", "o": [["A", "4"], ["B", "8"], ["C", "6"], ["D", "16"]], "a": "C", "e": "Slide practice: 3s² 3p⁴.", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 101, "q": "The valence electrons in thallium, xenon and rubidium are respectively:", "o": [["A", "3, 8, 1"], ["B", "1, 8, 3"], ["C", "3, 2, 1"], ["D", "3, 8, 2"]], "a": "A", "e": "Tl is Group 3A (3), Xe Group 8A (8), Rb Group 1A (1).", "sec": "Section 3: Atomic Structure and Electronic Configuration"}, {"n": 102, "q": "In 1829 Johann Döbereiner grouped similar elements into:", "o": [["A", "octaves"], ["B", "triads"], ["C", "periods"], ["D", "blocks"]], "a": "B", "e": "Slide: groups of three elements called triads.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 103, "q": "Which is NOT one of Döbereiner's triads?", "o": [["A", "Li, Na, K"], ["B", "S, Se, Te"], ["C", "C, N, O"], ["D", "Ca, Sr, Ba"]], "a": "C", "e": "Slide triads: Cl–Br–I; S–Se–Te; Ca–Sr–Ba; Li–Na–K.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 104, "q": "John Newlands (1864) connected chemical properties to:", "o": [["A", "atomic number"], ["B", "atomic masses"], ["C", "electronegativity"], ["D", "ionization energy"]], "a": "B", "e": "Slide: his relationship is the law of octaves.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 105, "q": "Newlands stated that when elements are arranged in increasing mass starting with lithium, the ____ element resembles the first.", "o": [["A", "fifth"], ["B", "seventh"], ["C", "eighth"], ["D", "tenth"]], "a": "C", "e": "Slide: eighth → first, ninth → second, tenth → third.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 106, "q": "Newlands compared the elements to:", "o": [["A", "colours of the rainbow"], ["B", "the notes in a musical scale"], ["C", "days of the week"], ["D", "planets"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 107, "q": "Newlands' law failed because:", "o": [["A", "he used atomic numbers"], ["B", "he tried to force all elements into octaves, and many heavier elements did not fit"], ["C", "he left gaps"], ["D", "he ignored masses"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 108, "q": "In 1869 Mendeleev, unaware of Newlands' work, arranged elements in order of increasing:", "o": [["A", "atomic number"], ["B", "atomic mass"], ["C", "density"], ["D", "radius"]], "a": "B", "e": "Slide: grouped elements with similar chemical behaviour together.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 109, "q": "Mendeleev avoided Newlands' mistake by:", "o": [["A", "leaving empty spaces for undiscovered elements"], ["B", "removing heavy elements"], ["C", "using isotopes"], ["D", "using atomic number"]], "a": "A", "e": "Slide: he assumed future elements would fit those spots.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 110, "q": "Mendeleev grouped ____ elements by properties and predicted properties of elements not yet discovered.", "o": [["A", "36"], ["B", "66"], ["C", "92"], ["D", "118"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 111, "q": "A limitation of Mendeleev's table was that:", "o": [["A", "it had no groups"], ["B", "not all elements were in order of atomic mass (inconsistencies unexplained)"], ["C", "it ignored chemistry"], ["D", "it had no gaps"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 112, "q": "Who explained the discrepancy in 1913 by relating protons (atomic number) to X-ray frequency?", "o": [["A", "Newlands"], ["B", "Döbereiner"], ["C", "Henry Moseley"], ["D", "Dalton"]], "a": "C", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 113, "q": "Today's periodic table arranges elements in order of increasing:", "o": [["A", "atomic mass"], ["B", "atomic number"], ["C", "density"], ["D", "valence"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 114, "q": "Vertical columns in the periodic table are called:", "o": [["A", "periods"], ["B", "groups or families"], ["C", "blocks only"], ["D", "series"]], "a": "B", "e": "Slide: elements in a vertical column have similar chemistry.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 115, "q": "Elements in the same group are related by their:", "o": [["A", "atomic masses"], ["B", "electronic configurations"], ["C", "colours"], ["D", "densities"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 116, "q": "The two group-numbering systems on the periodic table are:", "o": [["A", "1–8 with letters A and B (older) and 1–18 (newer)"], ["B", "1–10 and 1–20"], ["C", "I–X only"], ["D", "1–16 and 1–32"]], "a": "A", "e": "Slide: the older scheme gives more insight into electronic configurations.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 117, "q": "Main-group (representative) elements are:", "o": [["A", "Groups 1A–7A"], ["B", "1B–8B"], ["C", "the f-block"], ["D", "Group 8A only"]], "a": "A", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 118, "q": "Noble gases (Group 8A) all have the valence configuration ____ (except He).", "o": [["A", "ns²np²"], ["B", "ns²np⁴"], ["C", "ns²np⁶"], ["D", "ns¹"]], "a": "C", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 119, "q": "Transition elements, labelled 1B and 3B–8B, form the ____ block.", "o": [["A", "s"], ["B", "p"], ["C", "d"], ["D", "f"]], "a": "C", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 120, "q": "The lanthanides and actinides form the:", "o": [["A", "d-block"], ["B", "f-block"], ["C", "p-block"], ["D", "s-block"]], "a": "B", "e": "Slide.", "sec": "Section 4: Periodicity – Building Up of the Periodic Table"}, {"n": 121, "q": "Sodium has the configuration:", "o": [["A", "1s² 2s² 2p⁶ 3s¹ or [Ne]3s¹"], ["B", "[He]2s¹"], ["C", "[Ar]4s¹"], ["D", "[Ne]3s²"]], "a": "A", "e": "Slide Group 1A: Li [He]2s¹; Na [Ne]3s¹; K [Ar]4s¹; Rb [Kr]5s¹; Cs [Xe]6s¹; Fr [Rn]7s¹.", "sec": "Section 5: Properties of the Groups"}, {"n": 122, "q": "Francium has the configuration:", "o": [["A", "[Xe]6s¹"], ["B", "[Kr]5s¹"], ["C", "[Rn]7s¹"], ["D", "[Rn]7s²"]], "a": "C", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 123, "q": "Group 1A elements, called ____, have ____ valence electron(s).", "o": [["A", "alkaline earth metals, 2"], ["B", "alkali metals, 1"], ["C", "halogens, 7"], ["D", "noble gases, 8"]], "a": "B", "e": "Slide: similar configurations give similar chemistry.", "sec": "Section 5: Properties of the Groups"}, {"n": 124, "q": "Which is a property of Group 1A?", "o": [["A", "High ionization energy"], ["B", "Low ionization energy; never found in nature in the elemental state"], ["C", "Always form acidic oxides"], ["D", "Inert"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 125, "q": "Group 1A metals react with oxygen to form:", "o": [["A", "metal oxides, with peroxides and superoxides for some (Li, Na)"], ["B", "acids only"], ["C", "no products"], ["D", "nitrides only"]], "a": "A", "e": "Slide: oxides, peroxides and superoxides.", "sec": "Section 5: Properties of the Groups"}, {"n": 126, "q": "Group 2A elements, with configurations [He]2s² (Be), [Ne]3s² (Mg), [Ar]4s² (Ca), have ____ valence electrons.", "o": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "4"]], "a": "B", "e": "Slide: called the alkaline earth metals.", "sec": "Section 5: Properties of the Groups"}, {"n": 127, "q": "Compared with Group 1A, Group 2A elements are:", "o": [["A", "more reactive"], ["B", "less reactive, with reactivity increasing as the elements become larger"], ["C", "inert"], ["D", "non-metals"]], "a": "B", "e": "Slide: valence electrons are held more loosely as size increases.", "sec": "Section 5: Properties of the Groups"}, {"n": 128, "q": "Some Group 2A elements react with water or acid to produce:", "o": [["A", "O₂"], ["B", "H₂"], ["C", "Cl₂"], ["D", "N₂"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 129, "q": "Group 3A members all have ____ valence electrons.", "o": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "4"]], "a": "C", "e": "Slide: B [He]2s² 2p¹; Al [Ne]3s² 3p¹; Ga [Ar]4s² 3d¹⁰ 4p¹; In [Kr]5s² 4d¹⁰ 5p¹; Tl [Xe]6s² 4f¹⁴ 5d¹⁰ 6p¹.", "sec": "Section 5: Properties of the Groups"}, {"n": 130, "q": "In Group 3A, boron is a ____ and the others are ____.", "o": [["A", "metal, non-metals"], ["B", "metalloid, metals"], ["C", "non-metal, metalloids"], ["D", "gas, liquids"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 131, "q": "Aluminium forms ____ with oxygen and ____ ions in acid.", "o": [["A", "AlO, +1"], ["B", "Al₂O₃, +3"], ["C", "AlO₂, +2"], ["D", "Al₂O, +1"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 132, "q": "The other Group 3A metals (besides Al) form ____ ions.", "o": [["A", "+1 and +3"], ["B", "+2 only"], ["C", "−1"], ["D", "+4 only"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 133, "q": "The configuration of thallium is:", "o": [["A", "[Xe]6s² 4f¹⁴ 5d¹⁰ 6p¹"], ["B", "[Kr]5s² 4d¹⁰ 5p¹"], ["C", "[Ar]4s² 3d¹⁰ 4p¹"], ["D", "[Xe]6s² 6p²"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 134, "q": "Group 4A (Group 14) members have ____ valence electrons.", "o": [["A", "2"], ["B", "3"], ["C", "4"], ["D", "5"]], "a": "C", "e": "Slide: C [He]2s² 2p²; Si [Ne]3s² 3p²; Ge [Ar]4s² 3d¹⁰ 4p²; Sn [Kr]5s² 4d¹⁰ 5p²; Pb [Xe]6s² 4f¹⁴ 5d¹⁰ 6p².", "sec": "Section 5: Properties of the Groups"}, {"n": 135, "q": "In Group 4A, carbon is a non-metal, ____ are metalloids and the others are metals.", "o": [["A", "Si, Ge"], ["B", "Sn, Pb"], ["C", "Ge, Sn"], ["D", "C, Si"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 136, "q": "Group 4A elements form ____ oxidation states; Sn and Pb react with acid to produce H₂.", "o": [["A", "+1 and +3"], ["B", "+2 and +4"], ["C", "−1 and +1"], ["D", "+5 and +7"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 137, "q": "Group 5A (Group 15) members have ____ valence electrons.", "o": [["A", "3"], ["B", "4"], ["C", "5"], ["D", "6"]], "a": "C", "e": "Slide: N, P non-metals; As, Sb metalloids; Bi a metal.", "sec": "Section 5: Properties of the Groups"}, {"n": 138, "q": "Which compounds are important industrially from Group 5A?", "o": [["A", "HNO₃ and H₃PO₄"], ["B", "HCl and H₂SO₄"], ["C", "NaOH and KOH"], ["D", "CO and CO₂"]], "a": "A", "e": "Slide. Also: N₂ forms a variety of oxides; phosphorus exists as P₄.", "sec": "Section 5: Properties of the Groups"}, {"n": 139, "q": "Group 6A (Group 16), the oxygen family, has ____ valence electrons.", "o": [["A", "4"], ["B", "5"], ["C", "6"], ["D", "7"]], "a": "C", "e": "Slide: O, S, Se non-metals; Te metalloid; Po metal (slide also lists Se as a metalloid).", "sec": "Section 5: Properties of the Groups"}, {"n": 140, "q": "Which formulae are listed for Group 6A elements and compounds?", "o": [["A", "O₂, S₈, Se₈; SO₂, SO₃, H₂S, H₂SO₄"], ["B", "N₂, P₄"], ["C", "F₂, Cl₂"], ["D", "CH₄, SiH₄"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 141, "q": "Group 7A (Group 17), the halogens, have ____ valence electrons and are all ____.", "o": [["A", "7, diatomic non-metals"], ["B", "6, monatomic"], ["C", "8, inert"], ["D", "1, metals"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 142, "q": "Halogens do not exist in the elemental form in nature, and form:", "o": [["A", "ionic 'salts'"], ["B", "alloys"], ["C", "amalgams"], ["D", "noble gases"]], "a": "A", "e": "Slide: they also form molecular compounds with each other, e.g. I₂, Br₂.", "sec": "Section 5: Properties of the Groups"}, {"n": 143, "q": "Group 8A (Group 18) elements are all ____ with ____ valence shells.", "o": [["A", "diatomic, half-filled"], ["B", "monatomic, filled"], ["C", "metallic, empty"], ["D", "ionic, filled"]], "a": "B", "e": "Slide: they are inert and chemically stable.", "sec": "Section 5: Properties of the Groups"}, {"n": 144, "q": "Noble gases were considered 'inert' until ____, when Xe and Kr were used to form compounds.", "o": [["A", "1829"], ["B", "1869"], ["C", "1913"], ["D", "1963"]], "a": "D", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 145, "q": "Group 8A elements have ____ major commercial use.", "o": [["A", "a large"], ["B", "no"], ["C", "only medical"], ["D", "only fuel"]], "a": "B", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 146, "q": "Transition metals (1B, 2B–8B) have ____ being filled, show variable oxidation states, and form ____ compounds.", "o": [["A", "d orbitals, coloured"], ["B", "s orbitals, colourless"], ["C", "p orbitals, white"], ["D", "f orbitals, no"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 147, "q": "The lanthanides have ____ orbitals being filled while the actinides have ____ orbitals being filled.", "o": [["A", "4f, 5f"], ["B", "5f, 4f"], ["C", "3d, 4d"], ["D", "4s, 5s"]], "a": "A", "e": "Slide.", "sec": "Section 5: Properties of the Groups"}, {"n": 148, "q": "Atomic radius is the distance between:", "o": [["A", "two nuclei of different atoms"], ["B", "the nucleus of an atom and its valence shell"], ["C", "the two atoms in a crystal"], ["D", "the core and the proton"]], "a": "B", "e": "Slide, the periodicity of atomic radius.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 149, "q": "The metallic radius is:", "o": [["A", "half the distance between nuclei of two adjacent, identical metal atoms"], ["B", "the full distance between two nuclei"], ["C", "the radius of a cation"], ["D", "the radius of an anion"]], "a": "A", "e": "Slide: half the distance between nuclei of two atoms in contact in a crystalline solid metal.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 150, "q": "The covalent radius is half the distance between:", "o": [["A", "adjacent, identical nuclei in a molecule joined by a covalent bond"], ["B", "a cation and an anion"], ["C", "two metal atoms"], ["D", "nucleus and electron"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 151, "q": "An ionic radius is derived from the distance between the nuclei of:", "o": [["A", "two identical atoms"], ["B", "a cation and anion pair in an ionic bond"], ["C", "two molecules"], ["D", "two metals"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 152, "q": "The distance between nuclei used for atomic radii is determined experimentally by:", "o": [["A", "titration"], ["B", "X-ray crystallography"], ["C", "chromatography"], ["D", "distillation"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 153, "q": "Across a period from left to right, atomic radius:", "o": [["A", "increases"], ["B", "decreases, because shielding effect decreases and valence electrons are held tighter"], ["C", "stays constant"], ["D", "doubles"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 154, "q": "Down a group, atomic radius:", "o": [["A", "decreases"], ["B", "increases, since each step adds a new shell"], ["C", "is constant"], ["D", "halves"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 155, "q": "Covalent radius increases down a group because:", "o": [["A", "n increases by one for each element, so outer electrons are increasingly distant from the nucleus"], ["B", "Z decreases"], ["C", "electrons are removed"], ["D", "shielding decreases"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 156, "q": "Effective nuclear charge (Zeff) is:", "o": [["A", "the total charge of the nucleus"], ["B", "the pull exerted on a specific electron by the nucleus, taking electron–electron repulsions into account"], ["C", "the charge of an ion"], ["D", "the number of protons"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 157, "q": "For hydrogen, Z and Zeff are:", "o": [["A", "equal, since there is only one electron"], ["B", "different"], ["C", "zero"], ["D", "negative"]], "a": "A", "e": "Slide: for all other atoms, inner electrons partially shield outer electrons.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 158, "q": "Zeff is given by:", "o": [["A", "Z + shielding"], ["B", "Z − shielding"], ["C", "Z × shielding"], ["D", "Z / shielding"]], "a": "B", "e": "Slide: Zeff = Z − shielding.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 159, "q": "Shielding is determined by:", "o": [["A", "the probability of another electron being between the electron of interest and the nucleus, and electron–electron repulsions"], ["B", "atomic mass"], ["C", "isotopes"], ["D", "colour"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 160, "q": "Which electrons shield the nucleus best from the valence electrons?", "o": [["A", "Core (innermost) electrons; electrons in the same valence shell block each other less efficiently"], ["B", "valence electrons only"], ["C", "none"], ["D", "electrons in the same shell"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 161, "q": "Across a period, Z increases by one but shielding increases only slightly, so Zeff:", "o": [["A", "decreases"], ["B", "increases from left to right"], ["C", "is constant"], ["D", "becomes zero"]], "a": "B", "e": "Slide: higher Zeff draws electrons closer, making atomic/covalent radii smaller.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 162, "q": "Valence electrons are easiest to remove because they:", "o": [["A", "have the lowest energy"], ["B", "have the highest energies, are shielded more and are farthest from the nucleus"], ["C", "are closest to the nucleus"], ["D", "are paired"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 163, "q": "The screening-ability trend is given as:", "o": [["A", "s > d > p"], ["B", "p > d > s"], ["C", "d > p > s"], ["D", "all equal"]], "a": "A", "e": "⚠ This is as written on the slide (s-electrons > d-electrons > p-electrons); many textbooks give s > p > d > f.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 164, "q": "Down a group, Zeff:", "o": [["A", "increases as screening decreases"], ["B", "decreases as screening increases"], ["C", "stays the same"], ["D", "doubles"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 165, "q": "The increasing covalent-radius order for Ge, Fl, Br, Kr is:", "o": [["A", "Kr < Br < Ge < Fl"], ["B", "Fl < Ge < Br < Kr"], ["C", "Ge < Fl < Br < Kr"], ["D", "Br < Kr < Ge < Fl"]], "a": "A", "e": "Slide: radius increases down a group (Ge < Fl) and decreases across a period (Kr < Br < Ge).", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 166, "q": "In the sorting example, Fl stands for:", "o": [["A", "fluorine"], ["B", "flerovium, element 114"], ["C", "francium"], ["D", "fermium"]], "a": "B", "e": "Slide note: NOT fluorine.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 167, "q": "The radii of cations compared with their neutral atoms are:", "o": [["A", "larger"], ["B", "smaller (same Z, fewer electrons)"], ["C", "equal"], ["D", "double"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 168, "q": "The radii of anions compared with their neutral atoms are:", "o": [["A", "smaller"], ["B", "equal"], ["C", "larger (same Z, more electrons)"], ["D", "zero"]], "a": "C", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 169, "q": "A cation is smaller than its parent atom because, after valence electrons are removed:", "o": [["A", "remaining core electrons experience a greater Zeff and are drawn closer to the nucleus"], ["B", "the nucleus shrinks"], ["C", "protons are lost"], ["D", "shielding increases"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 170, "q": "The ionic radius of V²⁺ is 79 pm and of V³⁺ is 64 pm. This shows that:", "o": [["A", "cations with larger charges are smaller than those with smaller charges"], ["B", "larger charges give larger ions"], ["C", "charge has no effect"], ["D", "V³⁺ is an anion"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 171, "q": "An anion is larger than its parent atom because:", "o": [["A", "there is greater electron repulsion and a decrease in Zeff per electron"], ["B", "it loses protons"], ["C", "its nucleus expands"], ["D", "it loses shells"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 172, "q": "Atoms and ions with the same electron configuration are said to be:", "o": [["A", "isotopic"], ["B", "isoelectronic"], ["C", "isomeric"], ["D", "isobaric"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 173, "q": "Which series is isoelectronic (1s² 2s² 2p⁶)?", "o": [["A", "N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺, Al³⁺"], ["B", "Li, Na, K"], ["C", "P³⁻, S²⁻, Cl⁻"], ["D", "C, N, O"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 174, "q": "The isoelectronic series with the configuration [Ne]3s² 3p⁶ is:", "o": [["A", "N³⁻, O²⁻, F⁻"], ["B", "P³⁻, S²⁻, Cl⁻, Ar, K⁺, Ca²⁺, Sc³⁺"], ["C", "Li⁺, Be²⁺"], ["D", "Na⁺, Mg²⁺ only"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 175, "q": "In a series of isoelectronic ions and atoms, size is determined by the number of protons; the greater the nuclear charge:", "o": [["A", "the larger the radius"], ["B", "the smaller the radius"], ["C", "no change"], ["D", "the more electrons"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 176, "q": "The order of decreasing size of Na⁺, N³⁻, Mg²⁺, F⁻ and O²⁻ is:", "o": [["A", "N³⁻ > O²⁻ > F⁻ > Na⁺ > Mg²⁺"], ["B", "Mg²⁺ > Na⁺ > F⁻ > O²⁻ > N³⁻"], ["C", "O²⁻ > N³⁻ > F⁻ > Mg²⁺ > Na⁺"], ["D", "F⁻ > O²⁻ > N³⁻ > Na⁺ > Mg²⁺"]], "a": "A", "e": "Slide: all have 10 electrons (isoelectronic with Ne); N³⁻ has the highest electron/proton ratio (1.43) and Mg²⁺ the lowest (0.833).", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 177, "q": "In the ranking example, the largest ion is N³⁻ because it has:", "o": [["A", "the lowest ne/np ratio"], ["B", "the highest ratio of electrons to protons (1.43)"], ["C", "the most protons"], ["D", "the fewest electrons"]], "a": "B", "e": "Slide table: N³⁻ 7p/10e; O²⁻ 1.25; F⁻ 1.11; Na⁺ 0.909; Mg²⁺ 0.833.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 178, "q": "The first ionization energy (IE₁) is the energy required to:", "o": [["A", "add an electron to a gaseous atom"], ["B", "remove the most loosely bound electron from a gaseous atom in its ground state"], ["C", "remove two electrons"], ["D", "split a nucleus"]], "a": "B", "e": "Slide: forms a cation with +1 charge.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 179, "q": "The energy required to remove the second most loosely bound electron is the:", "o": [["A", "first EA"], ["B", "second ionization energy (IE₂)"], ["C", "lattice energy"], ["D", "bond energy"]], "a": "B", "e": "Slide: the third electron's energy is IE₃, and so on.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 180, "q": "Ionization processes are always:", "o": [["A", "exothermic with negative IE"], ["B", "endothermic with positive IE values"], ["C", "thermoneutral"], ["D", "spontaneous"]], "a": "B", "e": "Slide: energy is always required to remove electrons.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 181, "q": "For larger atoms the most loosely bound electron is:", "o": [["A", "closer to the nucleus and harder to remove"], ["B", "farther from the nucleus and easier to remove"], ["C", "paired"], ["D", "in the core"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 182, "q": "IE₁ generally ____ across a period and ____ down a group with increasing Z.", "o": [["A", "increases, decreases"], ["B", "decreases, increases"], ["C", "increases, increases"], ["D", "decreases, decreases"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 183, "q": "Boron has a lower IE₁ than beryllium because:", "o": [["A", "Be loses a p electron"], ["B", "B's removed electron is a 2p electron, which is higher in energy than a 2s electron, even though B has one more proton"], ["C", "B is larger than Be"], ["D", "B has fewer protons"]], "a": "B", "e": "Slide: an s electron is harder to remove than a p electron in the same shell.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 184, "q": "IE₁ increases from left to right across a period due to:", "o": [["A", "increasing Zeff"], ["B", "increasing n"], ["C", "increasing shielding"], ["D", "decreasing Z"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 185, "q": "IE₁ decreases down a column because:", "o": [["A", "Zeff increases"], ["B", "the distance of the electron from the nucleus increases as n increases"], ["C", "Z decreases"], ["D", "shielding decreases"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 186, "q": "Across Groups 2A to 3A, IE₁ shows a ____ because the 3A electron is removed from a higher-energy ____ subshell.", "o": [["A", "rise, s"], ["B", "drop, p"], ["C", "rise, p"], ["D", "drop, d"]], "a": "B", "e": "Slide hint: draw the electron configuration (ns² → ns²np¹).", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 187, "q": "IE₁ drops from Group 5A to 6A because:", "o": [["A", "5A has a filled stable p configuration, while 6A's configuration is disrupted by one extra electron"], ["B", "6A has fewer protons"], ["C", "6A is larger"], ["D", "5A has d electrons"]], "a": "A", "e": "⚠ As written on the slide ('filled stable p'); the p subshell of 5A is strictly halffilled (p³).", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 188, "q": "In multiple ionizations, the 2nd, 3rd, 4th electrons require:", "o": [["A", "less energy"], ["B", "more energy, and much more for core electrons"], ["C", "the same energy"], ["D", "no energy"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 189, "q": "Core electrons need much more energy to remove because they:", "o": [["A", "are closer to the nucleus and experience greater Zeff"], ["B", "are farther away"], ["C", "are shielded"], ["D", "are unpaired"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 190, "q": "Removing an electron from a cation is more difficult than from a neutral atom because of:", "o": [["A", "lower nuclear charge"], ["B", "greater electrostatic attraction to the cation"], ["C", "larger radius"], ["D", "lower Zeff"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 191, "q": "The order of increasing energy for IE₁(Al), IE₁(Tl), IE₂(Na), IE₃(Al) is:", "o": [["A", "IE₁(Tl) < IE₁(Al) < IE₃(Al) < IE₂(Na)"], ["B", "IE₁(Al) < IE₁(Tl) < IE₂(Na) < IE₃(Al)"], ["C", "IE₂(Na) < IE₃(Al) < IE₁(Al) < IE₁(Tl)"], ["D", "IE₁(Tl) < IE₂(Na) < IE₁(Al) < IE₃(Al)"]], "a": "A", "e": "Slide: 6p¹ (Tl) is easier to remove than 3p¹ (Al); IE₃ of Al removes from a cation; IE₂ of Na removes a core electron.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 192, "q": "Electron affinity (EA) is:", "o": [["A", "the energy change when an electron is added to a gaseous atom to form an anion"], ["B", "the energy to remove an electron"], ["C", "the energy to split a nucleus"], ["D", "the energy of a bond"]], "a": "A", "e": "Slide: or the energy released when a gas-phase atom accepts an electron.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 193, "q": "For Cl(g) + e⁻ → Cl⁻(g), the energy released is:", "o": [["A", "349.0 kJ/mol, ΔH negative"], ["B", "349.0 kJ/mol absorbed"], ["C", "0"], ["D", "100 kJ/mol"]], "a": "A", "e": "Slide (also quoted as −348 kJ/mol later, the highest EA of any element).", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 194, "q": "Elements with negative EA values:", "o": [["A", "absorb energy when accepting an electron"], ["B", "release energy when the gaseous atom accepts an electron"], ["C", "cannot form anions"], ["D", "have no valence electrons"]], "a": "B", "e": "Slide: for some elements energy is required and EA is positive.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 195, "q": "The second EA is the energy associated with adding an electron to:", "o": [["A", "a neutral atom"], ["B", "an anion to form a −2 ion"], ["C", "a cation"], ["D", "a nucleus"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 196, "q": "Across a period, EAs tend to become:", "o": [["A", "more positive"], ["B", "more negative as Zeff increases"], ["C", "zero"], ["D", "constant"]], "a": "B", "e": "Slide: it becomes easier to add an electron.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 197, "q": "Exceptions to the EA trend across a period are found in groups:", "o": [["A", "1A, 3A, 7A"], ["B", "2A, 5A, 8A"], ["C", "4A, 6A, 7A"], ["D", "1A, 4A, 6A"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 198, "q": "Group 2A deviates because it has a filled ns subshell, so the next electron goes into:", "o": [["A", "a lower-energy orbital"], ["B", "the higher-energy np orbital"], ["C", "the core"], ["D", "a d orbital"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 199, "q": "Group 5A deviates because it has a half-filled np subshell, so the next electron:", "o": [["A", "goes to the nucleus"], ["B", "must be paired with an existing np electron"], ["C", "enters a d orbital"], ["D", "is removed"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 200, "q": "Noble gases deviate because the incoming electron must be added to:", "o": [["A", "a lower shell"], ["B", "a higher n level, which is more difficult"], ["C", "the nucleus"], ["D", "a p orbital of the same shell"]], "a": "B", "e": "Slide: they have completely filled shells.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 201, "q": "In EA exceptions, the trend is disrupted by:", "o": [["A", "the initial relative stability of the electron configuration"], ["B", "atomic mass"], ["C", "isotopes"], ["D", "colour"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 202, "q": "Down a group, the atom at the top is expected to have the largest EA because:", "o": [["A", "its first ionization potential suggests the largest effective nuclear charge"], ["B", "it is largest"], ["C", "it has most shells"], ["D", "it has most electrons"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 203, "q": "Down a group, the ____ element most often has the greatest EA; the first member is reduced by electron–electron repulsion in the small n = 2 shell.", "o": [["A", "first"], ["B", "second"], ["C", "last"], ["D", "third"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 204, "q": "The EA of fluorine is:", "o": [["A", "−322 kJ/mol"], ["B", "−348 kJ/mol"], ["C", "+322 kJ/mol"], ["D", "0"]], "a": "A", "e": "Slide: the added electron enters n = 2 with significant repulsion from electrons already there.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 205, "q": "The element with the highest EA in the periodic table (−348 kJ/mol) is:", "o": [["A", "fluorine"], ["B", "chlorine"], ["C", "bromine"], ["D", "oxygen"]], "a": "B", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 206, "q": "Chlorine accepts an electron more readily than fluorine because the entering electron:", "o": [["A", "goes into the n = 3 shell, a larger region of space, so repulsions are reduced"], ["B", "goes into n = 1"], ["C", "is attracted by a smaller nucleus"], ["D", "pairs with a core electron"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 207, "q": "Fluorine has an energetically favourable EA and a large energy barrier to ionization, so:", "o": [["A", "it is much easier to form fluoride anions than cations"], ["B", "it forms cations easily"], ["C", "it is inert"], ["D", "it is a metal"]], "a": "A", "e": "Slide.", "sec": "Section 6: Periodic Variations in Element Properties"}, {"n": 208, "q": "Groups IA, IIA and IVA show different trends in reactivity and ionization energy because of their:", "o": [["A", "distinct electronic configurations"], ["B", "atomic masses"], ["C", "colours"], ["D", "densities"]], "a": "A", "e": "Slide: concepts (periodic table, reactivity, ionization energy).", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 209, "q": "Group IA (alkali metals) comprises Li, Na, K, Rb, Cs and Fr, each with ____ electron in the outermost shell.", "o": [["A", "one (ns¹)"], ["B", "two"], ["C", "four"], ["D", "eight"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 210, "q": "Group IA elements are highly reactive, especially with water, and reactivity:", "o": [["A", "decreases down the group"], ["B", "increases down the group"], ["C", "is constant"], ["D", "is zero"]], "a": "B", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 211, "q": "The ionization energy of Group IA is low because:", "o": [["A", "it is easy to remove the single outer electron"], ["B", "the atoms are small"], ["C", "they have full shells"], ["D", "they have 8 valence electrons"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 212, "q": "The configuration of K is:", "o": [["A", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ (2, 8, 8, 1)"], ["B", "2, 8, 1"], ["C", "2, 8, 18, 1"], ["D", "2, 8, 9"]], "a": "A", "e": "Slide (Na is 2, 8, 1).", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 213, "q": "Rb is [Kr]5s¹. Its shell arrangement is:", "o": [["A", "2, 8, 18, 8, 1"], ["B", "2, 8, 8, 1"], ["C", "2, 8, 18, 18, 8, 1"], ["D", "2, 8, 18, 32, 18, 8, 1"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 214, "q": "Cs, [Xe]6s¹, has the shell arrangement:", "o": [["A", "2, 8, 18, 8, 1"], ["B", "2, 8, 18, 18, 8, 1"], ["C", "2, 8, 8, 1"], ["D", "2, 8, 18, 32, 18, 8, 1"]], "a": "B", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 215, "q": "Fr, [Rn]7s¹, has the shell arrangement:", "o": [["A", "2, 8, 18, 18, 8, 1"], ["B", "2, 8, 18, 8, 1"], ["C", "2, 8, 18, 32, 18, 8, 1"], ["D", "2, 8, 8, 1"]], "a": "C", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 216, "q": "Group IA metals react with oxygen, halogens, nitrogen, hydrogen and sulphur to give respectively:", "o": [["A", "oxides (including peroxides, superoxides), halides, nitrides, hydrides, sulphides"], ["B", "acids only"], ["C", "carbonates"], ["D", "nothing"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 217, "q": "The only Group IA metal that reacts directly with nitrogen is:", "o": [["A", "sodium"], ["B", "potassium"], ["C", "lithium, forming trilithium nitride Li₃N"], ["D", "caesium"]], "a": "C", "e": "Slide: the others do not react with nitrogen at all.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 218, "q": "Group IA metals are stored in an airtight container under liquid paraffin, an inert liquid or inert gas because:", "o": [["A", "they rapidly tarnish in air"], ["B", "they are heavy"], ["C", "they are radioactive"], ["D", "they are acidic"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 219, "q": "Group IIA elements are called alkaline earth metals (except beryllium) because:", "o": [["A", "their oxides react with water to form alkalis; Be's oxide and hydroxide are amphoteric"], ["B", "they form acids"], ["C", "they are inert"], ["D", "they are halogens"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 220, "q": "Compared with Group IA, the ionization energy of Group IIA is:", "o": [["A", "lower"], ["B", "higher but still relatively low"], ["C", "the same"], ["D", "zero"]], "a": "B", "e": "Slide: reactivity is lower than IA but still reacts with water and acids, and increases down the group.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 221, "q": "Beryllium and magnesium can be stored in dry air because of:", "o": [["A", "a thin passivating oxide layer"], ["B", "their inertness"], ["C", "high density"], ["D", "low melting point"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 222, "q": "The more reactive Ca, Sr and Ba must be stored:", "o": [["A", "in water"], ["B", "under mineral oil, in an inert atmosphere, or sealed in airtight containers"], ["C", "in open air"], ["D", "in acid"]], "a": "B", "e": "Slide: to prevent reaction with oxygen and moisture.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 223, "q": "An effective method for preventing oxidation of Group IIA metals is storage under:", "o": [["A", "an inert gas such as argon"], ["B", "oxygen"], ["C", "chlorine"], ["D", "steam"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 224, "q": "The configurations of Sr and Ra are respectively:", "o": [["A", "[Kr]5s² and [Rn]7s²"], ["B", "[Ar]4s² and [Xe]6s²"], ["C", "[Kr]5s¹ and [Rn]7s¹"], ["D", "[Xe]6s² and [Rn]7s²"]], "a": "A", "e": "Slide: Be [He]2s²; Mg [Ne]3s²; Ca [Ar]4s²; Sr [Kr]5s²; Ba [Xe]6s²; Ra [Rn]7s².", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 225, "q": "Group IVA (carbon group) contains C, Si, Ge, Sn, Pb and Fl. Fl (flerovium) is:", "o": [["A", "a halogen"], ["B", "a radioactive element about which little is known of its chemical reactivity"], ["C", "a noble gas"], ["D", "a metalloid"]], "a": "B", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 226, "q": "Group IVA elements have ____ outer electrons; ____ are less reactive while tin and lead are more reactive.", "o": [["A", "four; carbon and silicon"], ["B", "two; carbon and tin"], ["C", "four; tin and lead"], ["D", "six; silicon and lead"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 227, "q": "Group IVA ionization energy is higher than IA and IIA because:", "o": [["A", "more energy is needed to remove electrons from a more stable half-filled p-orbital"], ["B", "they have one electron"], ["C", "they are larger"], ["D", "they have no p electrons"]], "a": "A", "e": "⚠ As worded on the slide (their configuration is ns²np²).", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 228, "q": "The configuration of Ge is:", "o": [["A", "[Ar] 3d¹⁰ 4s² 4p²"], ["B", "[Kr] 4d¹⁰ 5s² 5p²"], ["C", "[Ne] 3s² 3p²"], ["D", "[He] 2s² 2p²"]], "a": "A", "e": "Slide: C [He]2s² 2p²; Si [Ne]3s² 3p²; Sn [Kr]4d¹⁰ 5s² 5p²; Pb [Xe]4f¹⁴ 5d¹⁰ 6s² 6p²; Fl [Rn]5f¹⁴ 6d¹⁰ 7s² 7p².", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 229, "q": "The configuration of Pb is:", "o": [["A", "[Xe] 4f¹⁴ 5d¹⁰ 6s² 6p²"], ["B", "[Kr] 4d¹⁰ 5s² 5p²"], ["C", "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²"], ["D", "[Ar] 3d¹⁰ 4s² 4p²"]], "a": "A", "e": "Slide: Group IVA configurations (Sn is B, Fl is C, Ge is D).", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 230, "q": "Among the three groups, the most reactive with the lowest ionization energies is:", "o": [["A", "IA"], ["B", "IIA"], ["C", "IVA"], ["D", "all equal"]], "a": "A", "e": "Slide: comparison.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 231, "q": "The order of reactivity of the groups is:", "o": [["A", "IVA > IIA > IA"], ["B", "IA > IIA > IVA"], ["C", "IIA > IA > IVA"], ["D", "IA > IVA > IIA"]], "a": "B", "e": "Slide: IIA is less reactive than IA but more reactive than IVA.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 232, "q": "The group with the highest ionization energies and the least reactivity of the three is:", "o": [["A", "IA"], ["B", "IIA"], ["C", "IVA"], ["D", "none"]], "a": "C", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 233, "q": "Group IIA elements have ____ ionization energies, higher than Group IA.", "o": [["A", "moderate"], ["B", "the lowest"], ["C", "the highest"], ["D", "zero"]], "a": "A", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 234, "q": "Group IVA elements show ____ reactivity, generally less than Groups IA and IIA.", "o": [["A", "uniform"], ["B", "varied"], ["C", "no"], ["D", "explosive"]], "a": "B", "e": "Slide.", "sec": "Section 7: Comparative Chemistry of Groups IA, IIA and IVA"}, {"n": 235, "q": "Transition metals are elements in the middle of the periodic table, the ____ block.", "o": [["A", "s"], ["B", "p"], ["C", "d"], ["D", "f"]], "a": "C", "e": "Slide: they serve as a bridge between Groups I and II and Groups III–VIII.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 236, "q": "They are called 'transition metals' because they:", "o": [["A", "are all metals and serve as a transition/bridge between the s-blo
