ck and the later groups"], ["B", "are gases"], ["C", "are inert"], ["D", "are radioactive"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 237, "q": "The lanthanides and actinides are called:", "o": [["A", "d-block metals"], ["B", "f-block metals"], ["C", "halogens"], ["D", "alkali metals"]], "a": "B", "e": "Slide: transition metals are in the d-block.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 238, "q": "The lanthanides and actinides are sometimes called rare earth elements, or:", "o": [["A", "inner transition metals, because their atomic numbers fall between the last two periods"], ["B", "alkali metals"], ["C", "noble metals"], ["D", "halogens"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 239, "q": "Transition metals generally exhibit:", "o": [["A", "a single oxidation state"], ["B", "variable oxidation states, except a few"], ["C", "no oxidation"], ["D", "only −1"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 240, "q": "Transition metals have ____ in their commonly occurring oxidation states.", "o": [["A", "completely empty d orbitals"], ["B", "incompletely filled d orbitals"], ["C", "empty p orbitals"], ["D", "filled s orbitals only"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 241, "q": "Which is NOT a general characteristic of transition metals?", "o": [["A", "Coloured ions and compounds"], ["B", "Many are paramagnetic"], ["C", "Formation of complexes with ligands"], ["D", "Colourless, diamagnetic ions in all cases"]], "a": "D", "e": "Slide lists: variable oxidation states, coloured, paramagnetic, complexes, alloy formation.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 242, "q": "A characteristic of transition metals is:", "o": [["A", "alloy formation"], ["B", "inertness"], ["C", "gaseous state"], ["D", "no complexes"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 243, "q": "The configuration of chromium is [Ar] 3d⁵ 4s¹ and of copper [Ar] 3d¹⁰ 4s¹ because of:", "o": [["A", "additional stability of half- or fully-filled orbitals"], ["B", "a mistake"], ["C", "high mass"], ["D", "lanthanide contraction"]], "a": "A", "e": "Slide: seen in ₂₄Cr and ₂₉Cu.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 244, "q": "Which pairing of metal and configuration is correct?", "o": [["A", "Mn [Ar] 3d⁵ 4s²"], ["B", "Fe [Ar] 3d⁷ 4s²"], ["C", "Co [Ar] 3d⁶ 4s²"], ["D", "Zn [Ar] 3d⁸ 4s²"]], "a": "A", "e": "Slide: Sc 3d¹4s²; Ti 3d²4s²; V 3d³4s²; Cr 3d⁵4s¹; Mn 3d⁵4s²; Fe 3d⁶4s²; Co 3d⁷4s²; Ni 3d⁸4s²; Cu 3d¹⁰4s¹; Zn 3d¹⁰4s².", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 245, "q": "The oxidation state of Pt in [Pt(CN)₄]²⁻ is:", "o": [["A", "+2"], ["B", "+4"], ["C", "−2"], ["D", "0"]], "a": "A", "e": "Slide: x + (−1 × 4) = −2, x = +2, Pt(II).", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 246, "q": "The oxidation state of Fe in [Fe(CO)₅] is:", "o": [["A", "+5"], ["B", "+3"], ["C", "0"], ["D", "+2"]], "a": "C", "e": "Slide: x + (0 × 5) = 0, x = 0, Fe(0).", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 247, "q": "The oxidation state of Co in [Co(NH₃)₆]Cl₃ is:", "o": [["A", "+6"], ["B", "+3"], ["C", "+2"], ["D", "0"]], "a": "B", "e": "Slide: x + (0 × 6) + (−1 × 3) = 0, x = 3, Co(III).", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 248, "q": "Colour in transition metal compounds arises from two phenomena:", "o": [["A", "d–d transition and charge-transfer transition"], ["B", "nuclear decay and fission"], ["C", "hybridization and resonance"], ["D", "ionization and EA"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 249, "q": "In a d–d transition, electrons are:", "o": [["A", "promoted from a lower-energy d orbital to a higher-energy d orbital, with the energy absorbed related to colour"], ["B", "removed"], ["C", "added to s"], ["D", "paired"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 250, "q": "Ions with no electrons or full d orbitals are usually:", "o": [["A", "deeply coloured"], ["B", "pale or colourless"], ["C", "black"], ["D", "magnetic"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 251, "q": "Which ion is purple (d¹), blue (Cu²⁺, d⁹) and pale pink (Mn²⁺, d⁵) respectively?", "o": [["A", "Ti³⁺ is purple; Cu²⁺ is blue; Mn²⁺ is pale pink"], ["B", "Zn²⁺ purple"], ["C", "Sc³⁺ blue"], ["D", "Cu⁺ pink"]], "a": "A", "e": "Slide. Also: V³⁺, Fe²⁺, Ni²⁺ (d³, d⁶, d⁸) are green; Cr²⁺ is d⁴.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 252, "q": "Which are colourless (or white)?", "o": [["A", "Sc³⁺ (d⁰), Cu⁺ (d¹⁰), Zn²⁺ (d¹⁰)"], ["B", "Ti³⁺, Cu²⁺"], ["C", "Mn²⁺, Fe²⁺"], ["D", "Ni²⁺, V³⁺"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 253, "q": "In an octahedral field the five d orbitals, of equal energy, split into:", "o": [["A", "eg and t2g sets"], ["B", "s and p sets"], ["C", "3 sets"], ["D", "no splitting"]], "a": "A", "e": "Slide: due to differences in their shapes and orientation relative to the ligands.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 254, "q": "Of the t2g and eg sets in an octahedral field, the lower in energy is:", "o": [["A", "eg"], ["B", "t2g, so electrons fill there first"], ["C", "both equal"], ["D", "neither"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 255, "q": "The energy gap between t2g and eg orbitals is called:", "o": [["A", "Δo"], ["B", "ΔH"], ["C", "ΔG"], ["D", "ε"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 256, "q": "The t2g orbitals represent the ____ state and the eg orbitals the ____ state.", "o": [["A", "excited, ground"], ["B", "ground, excited"], ["C", "ground, ground"], ["D", "excited, excited"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 257, "q": "Absorption of light causes electrons to move from:", "o": [["A", "eg to t2g"], ["B", "t2g (ground state) to eg (excited state)"], ["C", "s to p"], ["D", "the nucleus to d"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 258, "q": "The colour seen is the:", "o": [["A", "light absorbed"], ["B", "light not absorbed (complementary colour)"], ["C", "infrared light"], ["D", "black"]], "a": "B", "e": "Slide: absorption of orange light makes the complex appear blue.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 259, "q": "Absorption at 360–420 nm (violet) gives which colour?", "o": [["A", "Green"], ["B", "Yellow"], ["C", "Orange"], ["D", "Red"]], "a": "A", "e": "Slide: violet → green.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 260, "q": "Absorbing 420–450 nm (indigo) gives:", "o": [["A", "Yellow"], ["B", "Green"], ["C", "Blue"], ["D", "Red"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 261, "q": "Absorbing 450–490 nm (blue) gives:", "o": [["A", "Yellow"], ["B", "Orange"], ["C", "Violet"], ["D", "Green"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 262, "q": "Absorbing 490–520 nm (blue-green) gives:", "o": [["A", "Red"], ["B", "Violet"], ["C", "Yellow"], ["D", "Indigo"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 263, "q": "Absorbing 520–580 nm (green) gives:", "o": [["A", "Violet"], ["B", "Red"], ["C", "Blue"], ["D", "Orange"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 264, "q": "Absorbing 580–590 nm (yellow) gives:", "o": [["A", "Indigo"], ["B", "Blue"], ["C", "Green"], ["D", "Red"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 265, "q": "Absorbing 590–630 nm (orange) gives:", "o": [["A", "Blue"], ["B", "Yellow"], ["C", "Green"], ["D", "Violet"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 266, "q": "Absorbing 630–720 nm (red) gives:", "o": [["A", "Blue-green"], ["B", "Orange"], ["C", "Violet"], ["D", "Yellow"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 267, "q": "The second phenomenon responsible for colour in transition metals is:", "o": [["A", "charge-transfer transition, ligand → metal (L→M) or metal → ligand (M→L)"], ["B", "fission"], ["C", "hybridization"], ["D", "isomerism"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 268, "q": "The purple colour of KMnO₄ (Mn⁷⁺, d⁰) is due to:", "o": [["A", "a d–d transition"], ["B", "an L→M charge-transfer transition"], ["C", "an M→L transition"], ["D", "paramagnetism"]], "a": "B", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 269, "q": "The name of [Fe(CO)₅] is:", "o": [["A", "pentacarbonyliron(0)"], ["B", "iron pentacarbonate"], ["C", "ferrous carbonyl"], ["D", "carbonyl iron(V)"]], "a": "A", "e": "Slide.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 270, "q": "The name of [Pt(CN)₄]²⁻ is:", "o": [["A", "platinum cyanide"], ["B", "tetracyanoplatinate(II) ion"], ["C", "tetracyanoplatinum(II)"], ["D", "platinate cyanide"]], "a": "B", "e": "Slide: the metal name ends in -ate in an anionic complex.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 271, "q": "The name of [Co(NH₃)₆]Cl₃ is:", "o": [["A", "cobalt ammonium chloride"], ["B", "hexaamminecobalt(III) chloride"], ["C", "hexaaminocobalt(II) chloride"], ["D", "cobalt(III) hexaammonia chloride"]], "a": "B", "e": "Slide: [Co(NH₃)₆]³⁺ 3Cl⁻.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 272, "q": "By the rules of naming complexes, K₃[Co(CN)₆] is named:", "o": [["A", "potassium hexacyanocobaltate(III)"], ["B", "potassium cobalt cyanide"], ["C", "hexacyanocobalt(III) potassium"], ["D", "potassium cyanocobaltate(VI)"]], "a": "A", "e": "Rules applied (the slide lists the formula for naming practice): anionic complex gives -ate; oxidation state 3 + 6(−1) + 3(+1) = 0.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 273, "q": "By the rules of naming complexes, [Ni(H₂O)₆]²⁺ is named:", "o": [["A", "hexaaquanickel(II) ion"], ["B", "nickel hexahydrate"], ["C", "hexaaquanickelate(II)"], ["D", "nickel water ion"]], "a": "A", "e": "Rules applied: a cationic complex keeps the metal name and ends with 'ion'.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 274, "q": "By the rules of naming complexes, a complex is named:", "o": [["A", "ligands first then the metal, as a single word for the coordination sphere"], ["B", "metal first"], ["C", "with a space between ligand and metal"], ["D", "without oxidation state"]], "a": "A", "e": "Slide: name the ligand; end the metal name with -ate in an anionic complex; write the oxidation state in parentheses.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 275, "q": "In naming complexes, a space is left:", "o": [["A", "between ligands"], ["B", "for counter ions before or after the coordination sphere"], ["C", "within the metal name"], ["D", "before the oxidation state"]], "a": "B", "e": "Slide: also, end the name with 'ion' if it carries a positive or negative charge.", "sec": "Section 8: Introduction to Transition Metal Chemistry"}, {"n": 276, "q": "The process of extracting metal ores buried deep underground is called:", "o": [["A", "smelting"], ["B", "mining"], ["C", "refining"], ["D", "leaching"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 277, "q": "Ores consist of the desired metal compound and impurities called:", "o": [["A", "slag"], ["B", "gangue"], ["C", "flux"], ["D", "coke"]], "a": "B", "e": "Slide: the impurities and earthly substances are called gangue.", "sec": "Section 9: Extraction of Metals"}, {"n": 278, "q": "In the reactivity series, the most reactive metals are:", "o": [["A", "at the bottom"], ["B", "at the top"], ["C", "in the middle"], ["D", "not listed"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 279, "q": "The tendency of a metal to become oxidised is linked to:", "o": [["A", "its colour"], ["B", "how reactive it is, i.e. its position in the reactivity series"], ["C", "its density"], ["D", "its hardness"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 280, "q": "Metals higher up in the reactivity series are ____ resistant to oxidation than those lower down.", "o": [["A", "more"], ["B", "less"], ["C", "equally"], ["D", "not"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 281, "q": "The method used to extract a metal is determined by:", "o": [["A", "its position on the reactivity series"], ["B", "its colour"], ["C", "its cost only"], ["D", "its density"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 282, "q": "The two major steps in extraction are:", "o": [["A", "concentration of the ore, then isolation of the metal (conversion to oxide by calcination or roasting, then reduction with a reducing agent)"], ["B", "mining only"], ["C", "alloying then casting"], ["D", "crushing then painting"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 283, "q": "Potassium, sodium, lithium, calcium, magnesium and aluminium are extracted by:", "o": [["A", "heating with carbon"], ["B", "electrolysis of the molten chloride or oxide"], ["C", "panning"], ["D", "found pure"]], "a": "B", "e": "Slide: large amounts of electricity are required, making it expensive.", "sec": "Section 9: Extraction of Metals"}, {"n": 284, "q": "Zinc, iron and copper are extracted by:", "o": [["A", "electrolysis"], ["B", "heating with a reducing agent such as carbon or carbon monoxide in a blast furnace"], ["C", "found as pure elements"], ["D", "leaching only"]], "a": "B", "e": "Slide: a cheap process as carbon is cheap and also a source of heat.", "sec": "Section 9: Extraction of Metals"}, {"n": 285, "q": "Silver and gold are:", "o": [["A", "extracted by electrolysis"], ["B", "found as pure elements"], ["C", "extracted in a blast furnace"], ["D", "roasted"]], "a": "B", "e": "Slide table: they are the least reactive.", "sec": "Section 9: Extraction of Metals"}, {"n": 286, "q": "Metals placed above carbon must be extracted by electrolysis because:", "o": [["A", "they are too reactive to be reduced by carbon"], ["B", "they are rare"], ["C", "carbon is expensive"], ["D", "they are heavy"]], "a": "A", "e": "Slide: lower placed metals can be extracted by heating with carbon.", "sec": "Section 9: Extraction of Metals"}, {"n": 287, "q": "Which is NOT a method of concentrating ores?", "o": [["A", "Gravity separation"], ["B", "Froth flotation"], ["C", "Calcination"], ["D", "Magnetic separation"]], "a": "C", "e": "Slide: concentration uses gravity separation, froth flotation, magnetic separation and leaching.", "sec": "Section 9: Extraction of Metals"}, {"n": 288, "q": "Gravity separation is used when gangue particles are ____ than the ore, for ____ ores.", "o": [["A", "heavier, sulfide"], ["B", "lighter, oxide and carbonate"], ["C", "lighter, sulfide"], ["D", "magnetic, any"]], "a": "B", "e": "Slide: crushed ore passes through a stream of water that washes away the lighter gangue.", "sec": "Section 9: Extraction of Metals"}, {"n": 289, "q": "Froth flotation is used to remove gangue from:", "o": [["A", "oxide ores"], ["B", "sulfide ores"], ["C", "carbonate ores"], ["D", "native metals"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 290, "q": "In froth flotation, the frother is:", "o": [["A", "pine oil; air is blown to create froth, gangue is wetted by water and the metal rises with the froth"], ["B", "water only"], ["C", "acid"], ["D", "iron filings"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 291, "q": "Magnetic separation is used when:", "o": [["A", "either the metal or gangue particles have magnetic properties; crushed ore passes over belts with magnetic rollers"], ["B", "the ore is liquid"], ["C", "ore is volatile"], ["D", "the gangue is lighter"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 292, "q": "Leaching is used to concentrate ores of:", "o": [["A", "aluminium, silver, gold, etc., by dissolving the ore in a solvent and leaving impurities behind"], ["B", "iron only"], ["C", "sodium only"], ["D", "carbon"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 293, "q": "Roasting is:", "o": [["A", "heating concentrated ore in the presence of air, mainly for sulfide ores to convert them into oxides"], ["B", "heating in absence of air"], ["C", "electrolysis"], ["D", "a leaching step"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 294, "q": "Cinnabar is the sulfide ore of mercury with the formula:", "o": [["A", "HgO"], ["B", "HgS"], ["C", "Hg₂S₃"], ["D", "HgCl₂"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 295, "q": "The roasting of cinnabar is: 2HgS(s) + 3O₂(g) → ?", "o": [["A", "2Hg + 2SO₂"], ["B", "2HgO(s) + 2SO₂(g)"], ["C", "HgSO₄"], ["D", "2HgO + 2S"]], "a": "B", "e": "Slide: the HgO then heats to give liquid mercury.", "sec": "Section 9: Extraction of Metals"}, {"n": 296, "q": "Further heating of mercuric oxide gives:", "o": [["A", "2HgO → 2Hg(l) + O₂"], ["B", "HgO → Hg + 2O"], ["C", "2HgO → Hg₂O"], ["D", "no reaction"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 297, "q": "Roasting zinc blende gives: 2ZnS + 3O₂ →", "o": [["A", "2Zn + 2SO₂"], ["B", "2ZnO + 2SO₂"], ["C", "ZnSO₄"], ["D", "2ZnO + 2S"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 298, "q": "Calcination is the heating of ore in:", "o": [["A", "excess air"], ["B", "the absence or a limited supply of air, used to convert carbonates and hydroxides into oxides"], ["C", "water"], ["D", "acid"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 299, "q": "Smithsonite (the carbonate ore of zinc) on heating in absence of air gives:", "o": [["A", "ZnO + CO₂"], ["B", "Zn + CO₂"], ["C", "ZnS"], ["D", "ZnO + CO"]], "a": "A", "e": "Slide: ZnCO₃ → ZnO + CO₂.", "sec": "Section 9: Extraction of Metals"}, {"n": 300, "q": "Limestone heated in a limited supply of air gives:", "o": [["A", "CaO + CO₂"], ["B", "Ca + CO₂"], ["C", "CaS"], ["D", "CaO + CO"]], "a": "A", "e": "Slide: CaCO₃ → CaO + CO₂.", "sec": "Section 9: Extraction of Metals"}, {"n": 301, "q": "Zinc oxide reduced with carbon gives:", "o": [["A", "impure zinc and carbon monoxide: ZnO + C → Zn + CO"], ["B", "zinc and CO₂"], ["C", "ZnC"], ["D", "no reaction"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 302, "q": "Copper oxide heated in hydrogen gives:", "o": [["A", "CuO + H₂ → Cu + H₂O"], ["B", "Cu + O₂"], ["C", "CuH"], ["D", "no reaction"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 303, "q": "Reduction of a metal oxide by a more reactive metal (displacement) is shown by:", "o": [["A", "3CuO + 2Al → 3Cu + Al₂O₃, the thermite reaction"], ["B", "CuO + H₂"], ["C", "ZnCO₃ → ZnO + CO₂"], ["D", "2HgS + 3O₂"]], "a": "A", "e": "Slide: aluminium is more reactive than copper.", "sec": "Section 9: Extraction of Metals"}, {"n": 304, "q": "The thermite reaction Fe₂O₃ + 2Al → 2Fe + Al₂O₃ is used to:", "o": [["A", "join railway tracks, since the large heat keeps the iron molten"], ["B", "make steel"], ["C", "refine copper"], ["D", "extract aluminium"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 305, "q": "Highly reactive metals such as Na and Mg cannot be obtained by reduction of their oxides because they:", "o": [["A", "have a high affinity for oxygen; they are isolated by electrolytic reduction of molten salts"], ["B", "are rare"], ["C", "are light"], ["D", "are inert"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 306, "q": "In the electrolysis of molten NaCl the electrodes are made of:", "o": [["A", "graphite"], ["B", "platinum"], ["C", "copper"], ["D", "iron"]], "a": "A", "e": "Slide: the electrolyte is the molten metal salt.", "sec": "Section 9: Extraction of Metals"}, {"n": 307, "q": "At the cathode in molten NaCl:", "o": [["A", "Na⁺ + e⁻ → Na"], ["B", "2Cl⁻ → Cl₂ + 2e⁻"], ["C", "Na → Na⁺ + e⁻"], ["D", "Cl₂ + 2e⁻ → 2Cl⁻"]], "a": "A", "e": "Slide: sodium ions are reduced at the cathode.", "sec": "Section 9: Extraction of Metals"}, {"n": 308, "q": "At the anode in molten NaCl:", "o": [["A", "Na⁺ + e⁻ → Na"], ["B", "2Cl⁻ → Cl₂ + 2e⁻"], ["C", "O²⁻ → O₂"], ["D", "H⁺ → H₂"]], "a": "B", "e": "Slide: chloride ions are oxidised and released as chlorine gas.", "sec": "Section 9: Extraction of Metals"}, {"n": 309, "q": "The overall reaction is:", "o": [["A", "2NaCl → 2Na + Cl₂"], ["B", "NaCl → NaOH"], ["C", "Na + Cl₂ → NaCl"], ["D", "2NaCl → Na₂ + Cl"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 310, "q": "In electrolytic refining the impure metal is the ____ and the pure metal is the ____.", "o": [["A", "cathode, anode"], ["B", "anode, cathode"], ["C", "electrolyte, anode"], ["D", "cathode, electrolyte"]], "a": "B", "e": "Slide: the metal salt solution is the electrolyte.", "sec": "Section 9: Extraction of Metals"}, {"n": 311, "q": "During electrolytic refining, insoluble impurities settle below the anode as:", "o": [["A", "slag"], ["B", "anode mud"], ["C", "gangue"], ["D", "froth"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 312, "q": "In refining copper, the electrolyte is:", "o": [["A", "copper sulfate solution"], ["B", "molten NaCl"], ["C", "cryolite"], ["D", "HCl"]], "a": "A", "e": "Slide: impure copper is the anode and pure copper the cathode.", "sec": "Section 9: Extraction of Metals"}, {"n": 313, "q": "In refining copper, at the anode copper is ____ and at the cathode copper ions are ____.", "o": [["A", "reduced, oxidised"], ["B", "oxidised to ions, reduced and deposited"], ["C", "neither"], ["D", "both oxidised"]], "a": "B", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 314, "q": "Iron is extracted from its ore ____ in a ____.", "o": [["A", "hematite, blast furnace"], ["B", "bauxite, blast furnace"], ["C", "hematite, electrolytic cell"], ["D", "cinnabar, furnace"]], "a": "A", "e": "Slide: modern blast furnaces produce about 10,000 tonnes of iron per day.", "sec": "Section 9: Extraction of Metals"}, {"n": 315, "q": "A blast furnace runs continuously because of:", "o": [["A", "the time and cost of getting the furnace up to temperature"], ["B", "low demand"], ["C", "safety rules"], ["D", "its small size"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 316, "q": "Raw materials added at the top of the blast furnace are:", "o": [["A", "hematite, coke and limestone (hot air at the bottom)"], ["B", "bauxite and cryolite"], ["C", "cinnabar"], ["D", "coke only"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 317, "q": "In the blast furnace, Fe₂O₃, C (coke) and CaCO₃ (limestone) are used respectively as:", "o": [["A", "source of iron, to provide carbon, to neutralise acidic impurities"], ["B", "fuel, flux, ore"], ["C", "ore, acid, base"], ["D", "none"]], "a": "A", "e": "Slide table.", "sec": "Section 9: Extraction of Metals"}, {"n": 318, "q": "Zone 1: coke burns in hot air forming:", "o": [["A", "CO₂, an exothermic reaction that heats the furnace: C + O₂ → CO₂"], ["B", "CO"], ["C", "Fe"], ["D", "CaO"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 319, "q": "Zone 2: more coke reacts with CO₂ to form:", "o": [["A", "CO: CO₂ + C → 2CO (CO₂ is reduced to CO)"], ["B", "O₂"], ["C", "CaO"], ["D", "Fe"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 320, "q": "Zone 3: carbon monoxide reduces iron(III) oxide:", "o": [["A", "Fe₂O₃ + 3CO → 2Fe + 3CO₂, molten iron collects at the bottom and is tapped off"], ["B", "Fe₂O₃ + C → Fe + CO"], ["C", "Fe + CO → FeO"], ["D", "FeO → Fe"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 321, "q": "Limestone in the furnace thermally decomposes to give:", "o": [["A", "CaO + CO₂"], ["B", "Ca + O₂"], ["C", "CaC₂"], ["D", "CaSiO₃"]], "a": "A", "e": "Slide: CaCO₃ → CaO + CO₂.", "sec": "Section 9: Extraction of Metals"}, {"n": 322, "q": "The calcium oxide reacts with the silicon dioxide impurity to form:", "o": [["A", "calcium silicate (CaO + SiO₂ → CaSiO₃), by neutralisation"], ["B", "calcium carbide"], ["C", "silica"], ["D", "Fe₂O₃"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 323, "q": "The molten calcium silicate is called ____ and it:", "o": [["A", "slag, floats on the molten iron and is tapped off separately"], ["B", "coke, sinks"], ["C", "ore, dissolves"], ["D", "flux, evaporates"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 324, "q": "The main ore of aluminium is ____ and aluminium is extracted by electrolysis because it is:", "o": [["A", "bauxite (contains Al₂O₃); above carbon in the reactivity series, so carbon cannot reduce it"], ["B", "hematite; below carbon"], ["C", "cinnabar; inert"], ["D", "galena; unreactive"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 325, "q": "Aluminium oxide is dissolved in molten cryolite because:", "o": [["A", "its melting point is over 2000 °C, and the mixture has a lower melting point without interfering with the reaction"], ["B", "cryolite is a reducing agent"], ["C", "it is acidic"], ["D", "it cools the cell"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 326, "q": "Cryolite is:", "o": [["A", "a rare white to colourless sodium aluminium fluoride mineral"], ["B", "iron ore"], ["C", "an alloy"], ["D", "a gas"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 327, "q": "The aluminium electrolysis cell is made of:", "o": [["A", "steel lined with graphite, where the graphite lining is the negative electrode and large graphite blocks are the positive electrodes"], ["B", "glass"], ["C", "copper"], ["D", "platinum"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 328, "q": "At the cathode (negative electrode) in the aluminium cell:", "o": [["A", "Al³⁺ + 3e⁻ → Al (reduction); molten Al forms at the bottom and is siphoned off"], ["B", "2O²⁻ → O₂ + 4e⁻"], ["C", "C + O₂ → CO₂"], ["D", "Al → Al³⁺"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 329, "q": "At the anode in the aluminium cell:", "o": [["A", "2O²⁻ → O₂ + 4e⁻ (oxidation)"], ["B", "Al³⁺ + 3e⁻ → Al"], ["C", "2Cl⁻ → Cl₂"], ["D", "H⁺ → H₂"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 330, "q": "The graphite anodes have to be replaced regularly because:", "o": [["A", "the carbon reacts with the oxygen produced: C + O₂ → CO₂, so the anode wears away"], ["B", "they melt"], ["C", "they dissolve in cryolite"], ["D", "they become magnetic"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 331, "q": "The major expense of aluminium extraction is:", "o": [["A", "the large amount of electricity required"], ["B", "the ore"], ["C", "cryolite only"], ["D", "labour"]], "a": "A", "e": "Slide.", "sec": "Section 9: Extraction of Metals"}, {"n": 332, "q": "In the atom, protons (+1, 1 amu) and neutrons (0, 1 amu) are located in the ____ and electrons (−1, ~0 amu) in the ____.", "o": [["A", "orbital, nucleus"], ["B", "nucleus, nucleus"], ["C", "orbital, orbital"], ["D", "nucleus, orbital"]], "a": "D", "e": "Slide table.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 333, "q": "The nucleus is composed of protons + neutrons, collectively called:", "o": [["A", "nucleons"], ["B", "leptons"], ["C", "isotopes"], ["D", "ions"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 334, "q": "For a nucleus denoted by its A and Z numbers, A (the mass number) is:", "o": [["A", "the number of electrons"], ["B", "the number of neutrons"], ["C", "the number of nucleons"], ["D", "the charge"]], "a": "C", "e": "Slide: A = atomic mass number = number of nucleons.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 335, "q": "Which determines the physical and chemical properties of atoms, ions and molecules?", "o": [["A", "Nucleons"], ["B", "Electrons"], ["C", "Neutrons"], ["D", "The nucleus"]], "a": "B", "e": "Slide: the nucleus/nucleons do not determine these properties but are rearranged to form different nuclei.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 336, "q": "The main difference between a chemical and a nuclear reaction is that in a nuclear reaction:", "o": [["A", "atoms are conserved"], ["B", "electrons are rearranged"], ["C", "atoms are not conserved but nucleons are"], ["D", "nothing changes"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 337, "q": "The mass defect (Δm) of a nuclide is the difference between:", "o": [["A", "the sum of the masses of its constituent nucleons and the actual mass of the nucleus"], ["B", "mass number and atomic number"], ["C", "two isotopes' masses"], ["D", "electron mass and proton mass"]], "a": "A", "e": "Slide: mass defect = mass of nucleons − mass of nucleus.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 338, "q": "The mass defect represents:", "o": [["A", "lost electrons"], ["B", "the mass of the energy binding the nucleus"], ["C", "the neutron mass"], ["D", "radiation"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 339, "q": "Nuclear binding energy is:", "o": [["A", "the energy to ionize an atom"], ["B", "the energy released on forming an anion"], ["C", "the energy of electrons"], ["D", "the energy required to split a nucleus into its component nucleons"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 340, "q": "Nuclear binding energy is a measure of:", "o": [["A", "the stability of the nucleus"], ["B", "reactivity"], ["C", "colour"], ["D", "electron count"]], "a": "A", "e": "Slide: the strength of the nuclear bond depends on the number of nucleons (n + p).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 341, "q": "Einstein's equation relating mass and energy is:", "o": [["A", "E = mc"], ["B", "ΔE = Δmc²"], ["C", "E = m/c²"], ["D", "E = mv²"]], "a": "B", "e": "Slide: law of conservation of mass-energy; every energy change is accompanied by a change in mass.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 342, "q": "In E = Δmc², E is in joules when:", "o": [["A", "m is in g, c in cm/s"], ["B", "m is in amu"], ["C", "m is in kg and c in m s⁻¹"], ["D", "m is in mol"]], "a": "C", "e": "Slide. Other units: J/nucleon, J/mole, MeV.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 343, "q": "To convert energy in joules to J/mole you:", "o": [["A", "divide by Avogadro's number"], ["B", "multiply by Avogadro's number"], ["C", "multiply by c"], ["D", "divide by nucleons"]], "a": "B", "e": "Slide. (For J/nucleon, divide by the number of nucleons.)", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 344, "q": "1 MeV equals:", "o": [["A", "1.6021892 × 10⁻¹³ J"], ["B", "1.66 × 10⁻²⁷ J"], ["C", "6.02 × 10²³ J"], ["D", "931.5 J"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 345, "q": "To convert mass in atomic mass units (u) to kg, multiply by:", "o": [["A", "6.022 × 10²³"], ["B", "3 × 10⁸"], ["C", "931.5"], ["D", "1.66053886 × 10⁻²⁷"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 346, "q": "U-235 has 92 protons, 143 neutrons and an observed mass of 235.04393 u (p = 1.007825 u, n = 1.008665 u). Its mass defect is:", "o": [["A", "0.35826 u"], ["B", "1.915065 u"], ["C", "2.862 u"], ["D", "235 u"]], "a": "B", "e": "Step 1: nucleon mass = 1.007825 × 92 + 1.008665 × 143. Step 2: subtract: 235.04393 − (that sum) as on the slide gives 1.915065 u (slide's working).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 347, "q": "Converting 1.915065 u to kg gives:", "o": [["A", "3.18004 × 10⁻²⁷ kg"], ["B", "1.66 × 10⁻²⁷ kg"], ["C", "2.862 × 10⁻¹⁰ kg"], ["D", "6.02 × 10⁻²³ kg"]], "a": "A", "e": "Slide: 1.915065 u × 1.66053886 × 10⁻²⁷ kg.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 348, "q": "The energy for U-235's mass defect, E = Δmc² = 3.18004 × 10⁻²⁷ kg × (3 × 10⁸)², is:", "o": [["A", "2.862 × 10⁻¹⁰ J"], ["B", "2.862 × 10¹⁰ J"], ["C", "3.18 × 10⁻²⁷ J"], ["D", "9 × 10¹⁶ J"]], "a": "A", "e": "Slide: 2.862 × 10⁻¹⁰ J (= 2.862 × 10⁻¹³ kJ, then × 6.02 × 10²³ for kJ/mol).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 349, "q": "³⁹₁₉K contains:", "o": [["A", "20 protons, 19 neutrons"], ["B", "19 protons, 20 neutrons"], ["C", "39 protons, 19 neutrons"], ["D", "19 protons, 39 neutrons"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 350, "q": "The mass of the nucleons in ³⁹₁₉K, (19 × 1.007825) + (20 × 1.008665), is:", "o": [["A", "38.96371 u"], ["B", "39.32197 u"], ["C", "0.35826 u"], ["D", "40.0 u"]], "a": "B", "e": "Slide: 19.148675 + 20.1733.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 351, "q": "With a nuclear mass of 38.96371 u, the mass defect of K-39 is:", "o": [["A", "39.32197 u"], ["B", "1.915 u"], ["C", "0.35826 u"], ["D", "0.8 u"]], "a": "C", "e": "Slide: 39.32197 − 38.96371.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 352, "q": "The mass defect of K-39 in kg (1 u = 1.6605655 × 10⁻²⁷ kg) is:", "o": [["A", "5.3469 × 10⁻¹¹ kg"], ["B", "3.2199 × 10¹³ kg"], ["C", "5.9493 × 10⁻²⁸ kg"], ["D", "8.56 kg"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 353, "q": "The binding energy of one K-39 nucleus (mc²) is:", "o": [["A", "3.2199 × 10¹³ J"], ["B", "5.3469 × 10⁻¹¹ J"], ["C", "8.56 J"], ["D", "5.9493 × 10⁻²⁸ J"]], "a": "B", "e": "Slide: 5.9493 × 10⁻²⁸ × (2.9979 × 10⁸)².", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 354, "q": "The total binding energy of one mole of K-39 atoms is:", "o": [["A", "5.3469 × 10⁻¹¹ J/mol"], ["B", "3.2199 × 10¹³ J/mol"], ["C", "8.56 J/mol"], ["D", "6.022 × 10²³ J/mol"]], "a": "B", "e": "Slide: 5.3469 × 10⁻¹¹ × 6.022 × 10²³.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 355, "q": "The binding energy of K-39 in MeV/nucleon is:", "o": [["A", "931.5"], ["B", "0.358"], ["C", "39"], ["D", "8.56"]], "a": "D", "e": "Slide: (0.35826 u × 931.5 MeV/c²)c² ÷ 39.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 356, "q": "The conversion used is:", "o": [["A", "1 u = 931.5 MeV/c²"], ["B", "1 u = 1.6 MeV"], ["C", "1 u = 13.6 eV"], ["D", "1 u = 6.02 MeV"]], "a": "A", "e": "Slide note.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 357, "q": "Binding energy per nucleon is:", "o": [["A", "total mass / nucleons"], ["B", "the average energy required to remove an individual nucleon from a nucleus = nuclear binding energy / number of nucleons"], ["C", "energy of electrons"], ["D", "the neutron energy"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 358, "q": "A large binding energy per nucleon means the nucleus is:", "o": [["A", "unstable"], ["B", "radioactive"], ["C", "more stable (large energy = stability)"], ["D", "a gas"]], "a": "C", "e": "Slide: useful for comparing one nucleus with another; analogous to the IE of an electron in an atom.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 359, "q": "Removing a nucleon requires about ____ whereas ionizing the ground-state electron of hydrogen requires 13.6 eV.", "o": [["A", "6–10 MeV"], ["B", "6–10 eV"], ["C", "13.6 MeV"], ["D", "931 MeV"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 360, "q": "Binding energy per nucleon is maximum at a mass number of about:", "o": [["A", "12"], ["B", "56"], ["C", "120"], ["D", "238"]], "a": "B", "e": "Slide: nuclei such as iron and nickel are the most stable; binding energy per nucleon increases rapidly for lighter elements.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 361, "q": "Fusion in the cores of stars ends with Fe because:", "o": [["A", "Fe is the most strongly bound (maximum binding energy per nucleon)"], ["B", "Fe is light"], ["C", "Fe is inert"], ["D", "Fe is radioactive"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 362, "q": "At low atomic masses (graph shape), ____ forces dominate over repulsive electrostatic forces between protons.", "o": [["A", "repulsive"], ["B", "magnetic"], ["C", "attractive nuclear"], ["D", "gravitational"]], "a": "C", "e": "Slide: as nucleons increase, they are held more strongly.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 363, "q": "At high atomic masses, ____ forces begin to dominate and tend to break apart the nucleus.", "o": [["A", "repulsive electrostatic"], ["B", "attractive nuclear"], ["C", "covalent"], ["D", "ionic"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 364, "q": "The four main types of nuclear reactions are:", "o": [["A", "fission, fusion, decay, transmutation"], ["B", "oxidation, reduction, hydrolysis, fusion"], ["C", "addition, substitution, fission, fusion"], ["D", "decay, ionization, EA, fusion"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 365, "q": "Nuclear fusion of light nuclei occurs naturally only in:", "o": [["A", "the earth's core"], ["B", "the sun and other stars"], ["C", "the atmosphere"], ["D", "reactors"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 366, "q": "Nuclear fission is when:", "o": [["A", "light nuclei combine"], ["B", "a large nucleus is split into smaller, lighter nuclei (e.g. when bombarded by neutrons), releasing a large amount of energy"], ["C", "an electron is emitted"], ["D", "an atom is ionized"]], "a": "B", "e": "Slide: also releases neutrons and γ photons.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 367, "q": "After fission the original nucleus mass is slightly higher than that of the products; this difference is the:", "o": [["A", "mass number"], ["B", "isotopic mass"], ["C", "mass defect"], ["D", "atomic mass"]], "a": "C", "e": "Slide: the final products are more stable.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 368, "q": "The U-235 fission equation is:", "o": [["A", "²³⁵₉₂U + ¹₀n → ⁸⁹₃₆Kr + ¹⁴⁴₅₆Ba + 3 ¹₀n"], ["B", "U → Th + He"], ["C", "U + n → Pb"], ["D", "U → 2Kr"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 369, "q": "For every neutron consumed in U-235 fission, ____ neutrons are produced.", "o": [["A", "one"], ["B", "two"], ["C", "four"], ["D", "three"]], "a": "D", "e": "Slide: hence its use in nuclear power plants.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 370, "q": "Fission is used in:", "o": [["A", "nuclear power plants (steam to generate electricity) and nuclear bombs"], ["B", "batteries only"], ["C", "paints"], ["D", "fertilisers"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 371, "q": "1 kg of uranium can release sufficient energy for combusting about ____ of coal.", "o": [["A", "4 million kg"], ["B", "4 billion kg"], ["C", "4 kg"], ["D", "4000 kg"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 372, "q": "In stellar fusion, four protons form two deuterons (4¹₁H → 2²₁D); each deuteron then fuses with a proton to form:", "o": [["A", "helium-3"], ["B", "helium-4"], ["C", "lithium"], ["D", "carbon"]], "a": "A", "e": "Slide: ²₁D + ¹₁H → ³₂He.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 373, "q": "Fusion in the sun ends with ³He + ³He giving:", "o": [["A", "U-235"], ["B", "hydrogen and helium-4 (2 ¹₁H + ⁴₂He), neutrinos, positrons and γ"], ["C", "carbon"], ["D", "iron"]], "a": "B", "e": "Slide. Energy is radiated because helium-4 has less rest mass than the 4 protons.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 374, "q": "The sun uses up about ____ of hydrogen nuclei per second.", "o": [["A", "600 tons"], ["B", "600 million tons"], ["C", "600 kg"], ["D", "6 billion tons"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 375, "q": "The energy released by the sun per second is about:", "o": [["A", "384.6 trillion trillion J"], ["B", "384.6 J"], ["C", "3.8 × 10³ J"], ["D", "384 kJ"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 376, "q": "Radioactivity is:", "o": [["A", "the combination of two nuclei"], ["B", "a chemical reaction of electrons"], ["C", "the ionization of atoms"], ["D", "the spontaneous decomposition of one nuclide to form a different nuclide, with emission of high-energy particles or electromagnetic radiation to gain stability"]], "a": "D", "e": "Slide: it can be natural or artificial; radionuclides are also called radioisotopes.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 377, "q": "In ²²⁶₈₈Ra → ⁴₂He + ²²²₈₆Rn, radium-226 is the ____ and radon-222 the ____.", "o": [["A", "daughter, parent"], ["B", "parent, daughter"], ["C", "product, reactant"], ["D", "isotope, isobar"]], "a": "B", "e": "Slide: parent nuclide and daughter nuclide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 378, "q": "An α-particle is:", "o": [["A", "an electron"], ["B", "a photon"], ["C", "a helium nucleus, ⁴₂He"], ["D", "a neutron"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 379, "q": "The net effect of α-emission is to:", "o": [["A", "reduce the mass number by 4 and the atomic number by 2"], ["B", "raise the atomic number by 1"], ["C", "reduce the mass number by 2"], ["D", "leave both unchanged"]], "a": "A", "e": "Slide: A/Z X → (A−4)/(Z−2) X + ⁴₂He + γ.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 380, "q": "²³⁸₉₂U undergoes α-decay to give:", "o": [["A", "²³⁸₉₃Np"], ["B", "²³⁴₉₀Th"], ["C", "²³⁴₉₁Pa"], ["D", "²³⁶₉₀Th"]], "a": "B", "e": "Slide: ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He + γ (mass 238 − 4 = 234; Z 92 − 2 = 90).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 381, "q": "After α-emission the nuclide is left in an excited state and then:", "o": [["A", "emits a β-particle"], ["B", "captures an electron"], ["C", "emits γ-radiation to reach the ground state"], ["D", "undergoes fusion"]], "a": "C", "e": "Slide: total energy of α + γ equals the reaction energy.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 382, "q": "Which nuclides undergo α-decay?", "o": [["A", "Light nuclides with high n/p"], ["B", "Heavy nuclides with low neutron/proton ratio, and those with Z > 83"], ["C", "All isotopes of hydrogen"], ["D", "Only stable nuclides"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 383, "q": "In ¹⁸⁵₇₉Au → ¹⁸¹₇₇Ir + ⁴₂He, the n/p ratio goes from 1.34 to ____, moving the daughter closer to the stability band.", "o": [["A", "1.00"], ["B", "1.35"], ["C", "1.50"], ["D", "0.9"]], "a": "B", "e": "Slide: 106/79 = 1.34 to 104/77 = 1.35.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 384, "q": "In β-decay (electron emission), the mass number ____ and the atomic number ____.", "o": [["A", "falls by 4, falls by 2"], ["B", "is unchanged, falls by 1"], ["C", "rises by 1, is unchanged"], ["D", "is unchanged, rises by 1"]], "a": "D", "e": "Slide: A/Z X → A/(Z+1) Y + ⁰₋₁e.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 385, "q": "¹⁴₆C → ?", "o": [["A", "¹⁴₇N + ⁰₋₁e"], ["B", "¹²₆C + 2n"], ["C", "¹⁴₅B + ⁰₊₁e"], ["D", "¹⁵₇N + ¹₀n"]], "a": "A", "e": "Slide: carbon-14 β-decays to nitrogen-14.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 386, "q": "The net effect of β-emission is conversion of a:", "o": [["A", "proton to neutron"], ["B", "neutron to proton (¹₀n → ¹₁p + ⁰₋₁e), so the n/p ratio decreases"], ["C", "neutron to electron only"], ["D", "proton to α"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 387, "q": "β-decay is the most common mode of decay because most radioactive nuclides:", "o": [["A", "lie below the stability band"], ["B", "have too many protons"], ["C", "lie above the stability band (too many neutrons)"], ["D", "are light"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 388, "q": "Gamma radiation is:", "o": [["A", "a stream of electrons"], ["B", "a helium nucleus"], ["C", "positively charged"], ["D", "a high-energy photon of short wavelength with no charge or mass"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 389, "q": "γ-rays often accompany nuclear decays, though they are:", "o": [["A", "not usually shown in nuclear equations"], ["B", "always shown"], ["C", "never emitted"], ["D", "only in fusion"]], "a": "A", "e": "Slide: emission of γ-rays takes the nucleus from an excited to the ground state (e.g. ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He + ⁰₀γ).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 390, "q": "A positron has:", "o": [["A", "the mass of a proton"], ["B", "the same mass as an electron but opposite charge (+1)"], ["C", "no mass"], ["D", "a negative charge"]], "a": "B", "e": "Slide: positron emission, β⁺ or ⁰₊₁e.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 391, "q": "Positron emission converts a:", "o": [["A", "neutron to proton"], ["B", "proton to neutron (¹₁p → ¹₀n + ⁰₊₁e): atomic number decreases by 1 and mass number is unchanged"], ["C", "proton to α"], ["D", "neutron to electron"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 392, "q": "¹¹₆C decays by positron emission to:", "o": [["A", "¹¹₇N"], ["B", "¹⁰₅B"], ["C", "¹¹₅B"], ["D", "¹²₇N"]], "a": "C", "e": "Slide: ¹¹₆C → ¹¹₅B + ⁰₊₁e.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 393, "q": "Positron emission is typical of isotopes with:", "o": [["A", "too many neutrons, above the band"], ["B", "Z > 83"], ["C", "too many protons (below the stability band); it increases the n/p ratio"], ["D", "a stable n/p ratio"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 394, "q": "Electron capture is the capture of:", "o": [["A", "an inner-shell electron by an unstable nucleus (proton) to produce a neutron"], ["B", "a neutron by an atom"], ["C", "an outer electron by an anion"], ["D", "a proton by an electron cloud"]], "a": "A", "e": "Slide: ¹₁p + ⁰₋₁e → ¹₀n.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 395, "q": "Electron capture by ²⁰¹₈₀Hg gives:", "o": [["A", "²⁰¹₈₁Tl"], ["B", "²⁰¹₇₉Au"], ["C", "²⁰₀₇ₙPt"], ["D", "²⁰¹₈₀Hg + γ"]], "a": "B", "e": "Slide: ²⁰¹₈₀Hg + ⁰₋₁e → ²⁰¹₇₉Au + γ.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 396, "q": "After electron capture, ____ are emitted as electrons rearrange (e.g. ⁵⁰₂₃V + ⁰₋₁e → ⁵⁰₂₂Ti).", "o": [["A", "alpha particles"], ["B", "neutrons"], ["C", "positrons"], ["D", "X-rays"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 397, "q": "The change from one isotope to another, through radioactive decay or bombardment, is called:", "o": [["A", "fusion"], ["B", "transmutation"], ["C", "ionization"], ["D", "hybridization"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 398, "q": "Bombarding particles used for transmutation include:", "o": [["A", "α-particles from natural emitters, neutrons from atomic reactors, and protons (from hydrogen)"], ["B", "only electrons"], ["C", "only photons"], ["D", "β-particles"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 399, "q": "β-particles are not used for transmutation because they are:", "o": [["A", "too heavy"], ["B", "neutral"], ["C", "strongly repelled by the orbital electrons and cannot get through in most cases"], ["D", "too slow"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 400, "q": "The first transmutation under laboratory conditions (Rutherford's group, 1925) was:", "o": [["A", "⁴₂He + ¹⁴₇N → ¹⁸₉F** → ¹⁷₈O + ¹₁p"], ["B", "¹₁p + ⁷₃Li → 2⁴₂He"], ["C", "²³⁸U → Th"], ["D", "¹⁴C → ¹⁴N"]], "a": "A", "e": "Slide (** = high energy; ¹⁷₈O is a rare but stable isotope).", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 401, "q": "Over ____ radionuclides have been made by transmutations, many not occurring in nature.", "o": [["A", "30"], ["B", "300"], ["C", "3000"], ["D", "30 000"]], "a": "C", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 402, "q": "All trans-uranium elements (Z > 92) are:", "o": [["A", "stable"], ["B", "radioactive and were made artificially by high-energy bombardment"], ["C", "natural gases"], ["D", "metals found in ores"]], "a": "B", "e": "Slide: e.g. element 111 was made by bombarding bismuth with nickel for several days.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 403, "q": "The synthetic elements 93–103 complete the:", "o": [["A", "lanthanide series"], ["B", "halogens"], ["C", "noble gases"], ["D", "actinide series"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 404, "q": "Elements 104, 105, 106, 107 and 109 have been made but:", "o": [["A", "are surrounded by controversies which have complicated naming them"], ["B", "are stable"], ["C", "occur naturally"], ["D", "are gases"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 405, "q": "On capture of a bombarding particle, a compound nucleus is formed which:", "o": [["A", "is stable"], ["B", "has all the energy of the bombarding particle and is unstable"], ["C", "has no energy"], ["D", "is neutral"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 406, "q": "The compound nucleus gets rid of excess energy by:", "o": [["A", "ejecting a high-energy particle (neutron, proton, electron) or emitting γ-radiation; the overall effect is a transmutation"], ["B", "absorbing electrons"], ["C", "dissolving"], ["D", "cooling"]], "a": "A", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 407, "q": "The first experimentally induced transmutation was Li-7 capturing a proton to give a compound nucleus, ⁸₄Be**, which breaks into:", "o": [["A", "⁴₂He + n"], ["B", "¹₁H + ³₂He"], ["C", "two α-particles (2⁴₂He)"], ["D", "C-12"]], "a": "C", "e": "Slide: ¹₁p + ⁷₃Li → ⁸₄Be** → 2⁴₂He.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 408, "q": "The decay pattern of a compound nucleus depends on:", "o": [["A", "the bombarding particle used"], ["B", "the amount of energy, not the bombarding particle used"], ["C", "the colour"], ["D", "temperature"]], "a": "B", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 409, "q": "The high-energy ²⁷₁₃Al** compound nucleus could be made using:", "o": [["A", "only neutrons"], ["B", "only electrons"], ["C", "α-particles (on Na-23), protons (on Mg-26) or deuterons (on Mg-25)"], ["D", "β-particles"]], "a": "C", "e": "Slide: ⁴₂He + ²³₁₁Na; ¹₁p + ²⁶₁₂Mg; ²₁D + ²⁵₁₂Mg.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 410, "q": "One decay mode of ²⁷₁₃Al** is:", "o": [["A", "²⁷₁₃Al** → ²⁷₁₃Al + ⁰₀γ"], ["B", "→ ²⁷₁₄Si"], ["C", "→ ²⁸₁₃Al"], ["D", "→ ⁹₄Be"]], "a": "A", "e": "Slide: others are ²⁶₁₂Mg + ¹₁p; ²⁶₁₃Al + ¹₀n; ²⁵₁₂Mg + ¹₀n + ¹₁p; ²³₁₁Na + ⁴₂He.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 411, "q": "Of the aluminium isotopes in these decays, the unstable one is Al-26 with a half-life of:", "o": [["A", "7.4 × 10⁵ y"], ["B", "7.4 × 10³ y"], ["C", "7.4 s"], ["D", "74 days"]], "a": "A", "e": "Slide: all the others are stable.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 412, "q": "Neptunium-237, with a half-life of over 2 million years, no longer occurs naturally because:", "o": [["A", "it never existed"], ["B", "the earth is over 4 billion years old, long enough for all of it to have decayed"], ["C", "it is a gas"], ["D", "it is stable"]], "a": "B", "e": "Slide: many isotopes above 83 had half-lives too short to survive.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 413, "q": "To make heavier elements, bombarding particles larger than neutrons are used, such as:", "o": [["A", "electrons"], ["B", "β-particles"], ["C", "photons"], ["D", "α-particles and accelerated cations of C-12, N-15, O-18 and Ne-22"]], "a": "D", "e": "Slide.", "sec": "Section 10: Introduction to Nuclear Chemistry"}, {"n": 414, "q": "The most useful transmutations in practice produce radionuclides with:", "o": [["A", "very short half-lives"], ["B", "sufficiently long half-lives for
