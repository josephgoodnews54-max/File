const DETAIL = {
1:"Atoms rarely use their pure s and p orbitals to bond. Instead, orbitals of similar energy blend into the same number of new, identical orbitals. This blending is called hybridization. Resonance is about moving electrons between structures, ionization is removing an electron, and polarization is distortion of an electron cloud.",
2:"The new orbitals made by mixing are called hybrid orbitals. Molecular orbitals come from combining orbitals of two different atoms, degenerate orbitals are simply orbitals of equal energy, and antibonding orbitals are the higher-energy partner of a bonding orbital.",
3:"For an atom to bond in a new geometry, one or more electrons are first promoted to a slightly higher orbital (the excited state). The orbitals involved, all or some of them, are then reshuffled into hybrids. Hybridization is not a mixing of nuclei or of inner-shell orbitals.",
4:"All the hybrid orbitals of one kind (for example, all four sp³ orbitals of carbon) have the same shape, size and energy, so they are equivalent. That is why the four C–H bonds in methane are identical. They are not different in energy, and each still has s character.",
5:"Orbitals are conserved. If you mix 1 s and 3 p orbitals you get exactly 4 hybrid orbitals. The count depends on how many pure atomic orbitals are mixed, not on valence electrons, lone pairs or atomic number.",
6:"A hybrid orbital is a new orbital, so its shape, size, orientation and energy differ from the pure s or p orbitals that made it. For example, an sp³ hybrid is lop-sided, with one large lobe pointing toward the bonding atom.",
7:"The name of a hybrid tells you what was mixed. 'sp²' means one s and two p orbitals, and 'sp³d' means one s, three p and one d. The label does not state the bond angle, electron count or shape directly.",
8:"An sp hybrid is made from one s and one p orbital, so it is 50% s and 50% p in character. In the same way, sp² is about 33% s and sp³ is 25% s.",
9:"sp hybridization mixes one s orbital and one p orbital to give two sp orbitals. The number of products always equals the number of orbitals mixed, so one s plus one p cannot give three or four.",
10:"In BeF₂ the two sp orbitals on Be point in opposite directions, 180° apart, and each overlaps with a half-filled orbital on a fluorine atom. Two bonding regions as far apart as possible give a linear F–Be–F molecule.",
11:"Ground-state Be is 2s², with no unpaired electrons. One 2s electron is promoted to a 2p orbital, giving 2s¹2p¹. Now there are two unpaired electrons, and the s and p orbitals can mix into two sp hybrids that form the two Be–F bonds.",
12:"sp² hybridization mixes one s and two p orbitals and gives three equivalent sp² orbitals. These point to the corners of a triangle, 120° apart, as in BF₃. The third p orbital is left unhybridized.",
13:"Boron in BF₃ uses three sp² orbitals, which sit 120° apart in one plane, so the molecule is trigonal planar. A bond angle of 90° with a square shape, 109°28′ with a tetrahedron, and 180° with a line belong to other hybridizations.",
14:"In the orbital diagram, the dotted lines show where an electron from a fluorine atom is being shared with boron to form each B–F bond. They do not represent lone pairs or empty orbitals.",
15:"sp³ hybridization mixes one s and three p orbitals into four sp³ orbitals that point toward the corners of a tetrahedron. Methane (CH₄) is the standard example.",
16:"The four sp³ orbitals of carbon are 109°28′ apart and each overlaps with an H 1s orbital. Four identical bonds spread evenly in space give a symmetrical tetrahedral molecule.",
17:"Ground-state carbon is 2s²2p² with only two unpaired electrons. One 2s electron is promoted to the empty 2p orbital, giving 2s¹2p³ and four unpaired electrons. These four orbitals then mix into four sp³ hybrids.",
18:"sp³d hybridization gives five orbitals, which fits a central atom with five bonded atoms. PCl₅ is the example, with P bonded to five Cl atoms. SF₆ has six bonds (sp³d²), BF₃ has three (sp²), and CH₄ has four (sp³).",
19:"Ground-state P is 3s²3p³. To make five bonds, one 3s electron is promoted into an empty 3d orbital, giving 3s¹3p³3d¹ with five unpaired electrons. The one s, three p and one d orbitals then mix into five sp³d hybrids.",
20:"One s plus three p plus two d is 6 orbitals, so 6 hybrid orbitals result. This is sp³d² hybridization, which gives an octahedral arrangement as in SF₆.",
21:"In SF₆ the sulfur atom uses six sp³d² hybrid orbitals. In the diagram's note, the longer arrow marks the electron donated by fluorine, whereas the sulfur electrons are shown separately.",
22:"VSEPR stands for Valence Shell Electron Pair Repulsion. The idea is simple: electron pairs in the outer shell of an atom repel one another, so they spread out as far apart as possible, and that arrangement sets the molecule's shape. Nuclear charge, neutron count and ionization energy do not decide it.",
23:"All the electron pairs in the valence shell count, both bonding pairs and lone pairs. Ignoring either kind would give wrong shapes, for example water would look linear if its lone pairs were ignored. Core electrons are too close to the nucleus to matter.",
24:"A bond pair is held between two nuclei, so it is pulled into a narrow region. A lone pair feels only one nucleus, so its cloud spreads out and takes up more room, which pushes the other pairs away more strongly.",
25:"Since a lone pair is the most spread out, lone pair–lone pair repulsion is the strongest, then lone pair–bond pair, and bond pair–bond pair is the weakest: LP–LP > LP–BP > BP–BP. This is why lone pairs squeeze bond angles smaller.",
26:"Between bonding pairs, the repulsion depends on how strongly the central atom pulls the electrons. When the surrounding atoms are more electronegative, the bonding electrons are pulled away from the centre, so the pairs repel each other less and the bond angle shrinks.",
27:"Multiple bonds put more electron density in the same direction, so they repel more: triple > double > single. This is why a double bond slightly squeezes the other bond angles on its atom.",
28:"Repulsion between two charges falls quickly as they get farther apart. At a wider bond angle the pairs are further apart, so repulsion drops sharply. The molecule settles at the angle where repulsion is lowest.",
29:"Carbon in methane mixes one s and three p orbitals into four sp³ hybrids. Each overlaps with a hydrogen 1s orbital. Four equivalent bonds spread out evenly in a tetrahedron, giving H–C–H angles of 109.5°.",
30:"In ethane, each carbon uses its four sp³ orbitals: three overlap with hydrogen 1s orbitals, and the fourth points at the other carbon. The two remaining sp³ orbitals overlap head-on to form the C–C sigma bond.",
31:"In ethylene each carbon is bonded to three atoms, so it uses three sp² orbitals for sigma bonds. The leftover 2pz orbital on each carbon overlaps sideways with the other to form a π bond, giving the C=C double bond.",
32:"In acetylene each carbon uses two sp orbitals for sigma bonds and keeps two unhybridized p orbitals (2py and 2pz). Each pair overlaps sideways to form a π bond, so the triple bond is one sigma and two π bonds.",
33:"sp³ means four bonding regions, and four regions spread out as far as possible in a tetrahedron. Methane is the standard example, with bond angles of 109.5°.",
34:"sp² means three regions arranged flat at 120° (trigonal planar). Ethene and BCl₃ both fit this, since each central atom has three bonded regions and no lone pair.",
35:"sp means two regions, which sit opposite each other at 180° (linear). Acetylene (C₂H₂) and BeH₂ are examples.",
36:"More bonds between two carbons pull them closer together. The bond lengths are ethane 1.54 Å, ethene 1.33 Å and ethyne 1.20 Å, so ethyne with its triple bond has the shortest C–C bond.",
37:"More bonds also mean a stronger link. The C–C bond energies rise from ethane (88 kcal/mol) to ethene (152) to ethyne (200). Strength and shortness go together.",
38:"The C–H bond in ethyne uses an sp orbital, which has the most s character. That brings the nuclei closer together (1.06 Å against 1.10 Å in ethane), and the bond is stronger (131 against 101 kcal/mol).",
39:"Ethane is sp³ (109.5°), ethene is sp² (120°) and ethyne is sp (180°). The angle widens as the number of regions around the carbon falls from four to three to two.",
40:"A double or triple bond holds the two carbons together more tightly than a single bond. They sit closer (shorter) and it takes more energy to break (stronger). Longer and weaker describes a single bond.",
41:"An s orbital is closer to the nucleus than a p orbital, so hybrid orbitals with more s character pull the bonded atom closer and hold it more firmly. More s character gives shorter, stronger bonds.",
42:"The hydrogen 1s orbital is small and held close to its nucleus, and an sp³ orbital of carbon is lopsided but shorter than a long sp³–sp³ overlap. In C–H the two nuclei sit closer than in C–C, so C–H is shorter and stronger than the C–C sigma bond.",
43:"With more s character, the hybrid orbitals are pushed further apart: sp (50% s) gives 180°, sp² (33%) gives 120° and sp³ (25%) gives about 109.5°. So more s character means a larger angle.",
44:"Count the π bonds on the atom. None means sp³, one π bond means sp², and two π bonds means sp. An atom with two π bonds (as in a triple bond or two double bonds) uses only two hybrid orbitals.",
45:"CH₃⁺ has three bonds and no lone pair, so carbon is sp² and the shape is trigonal planar. The unused p orbital sticks out above and below the plane and is empty, which is why the cation is so reactive.",
46:"In the methyl radical the carbon has three sp² bonds. Its one extra, unpaired electron sits in the leftover p orbital perpendicular to the plane. The unpaired electron is not in an sp² orbital or in a 1s orbital.",
47:"CH₃⁻ has three bonds plus one lone pair, giving four regions, so carbon is sp³. Three sp³ orbitals bond to hydrogen and the fourth holds the non-bonding pair. The shape is a pyramid, based on a tetrahedron.",
48:"Oxygen in water has two bonds and two lone pairs, which makes four regions and so sp³. Two sp³ orbitals form the O–H bonds, and the other two hold lone pairs. Water is therefore bent, not linear.",
49:"The four electron regions around O would give 109.5° if they were equal, but the two lone pairs repel more strongly than the bonding pairs. They squeeze the H–O–H angle down to 104.5°. Bond pair–bond pair repulsion alone would not cause this.",
50:"The outline for this section lists electronic configuration, periodicity and the building up of the periodic table together, since the arrangement of electrons explains the layout of the periodic table. The other options are topics from other courses.",
51:"Matter is defined by two things: it takes up space (has volume) and it has mass. Colour, light emission and conductivity are properties that only some matter shows.",
52:"Just as bricks are the units that make up a house, atoms are the basic units that make up all matter, so they are called its building blocks.",
53:"Dalton's first idea was that atoms cannot be created or destroyed in a chemical reaction. This matches the law of conservation of mass, because the same atoms are only rearranged.",
54:"In a reaction, atoms are not turned into other elements and are not destroyed. They only change partners, so the substances that form are different even though the atoms are the same.",
55:"Dalton said all atoms of one element are identical, and are different from the atoms of every other element. (We now know isotopes slightly differ in mass, and atoms are divisible.)",
56:"Dalton's fourth postulate: a compound always contains the same kinds of atoms in the same ratio. Water is always two hydrogen atoms to one oxygen atom, which is the law of constant composition.",
57:"Rutherford's gold-foil work showed that most of the atom is empty space, with a tiny, dense, positively charged nucleus at the centre. This replaced the solid-sphere model.",
58:"James Chadwick found the neutron in 1932. Neutrons have no charge, so they were hard to detect, which explains why they were found long after the proton and electron.",
59:"Protons and neutrons are packed in the nucleus, and the electrons move around it. The electrons do not sit in the nucleus.",
60:"The electron was discovered in 1887 by J.J. Thomson, with Stoney and Lorentz also credited in the slide. Its charge is −1.602 × 10⁻¹⁹ C and its mass is about 1/1836 that of a proton.",
61:"Goldstein and Rutherford are credited for the proton (1907 on the slide). It has a charge of +1.602 × 10⁻¹⁹ C and a mass of about 1 amu.",
62:"The neutron was discovered by James Chadwick in 1932. Its mass (1.6749 × 10⁻²⁷ kg) is just above the proton's, and it carries no charge.",
63:"An atomic mass unit is defined as one twelfth of the mass of a carbon-12 atom, which is about 1.66 × 10⁻²⁷ kg. It is close to the mass of one proton or neutron.",
64:"In the symbol for an isotope, the mass number A is the total count of protons plus neutrons, and Z is the number of protons. The slide's labels are swapped, which is why this question is marked with a warning.",
65:"The farther a shell is from the nucleus, the weaker the pull on its electrons, so those electrons have higher energy. The shell closest to the nucleus has the lowest energy.",
66:"Orbital shapes are labelled s, p, d and f. The number in front, such as the 2 in 2p, tells you the energy level.",
67:"s holds 2, p holds 6, d holds 10 and f holds 14 electrons. These are 1, 3, 5 and 7 orbitals respectively, with 2 electrons in each orbital.",
68:"An s orbital is a sphere, and the sphere gets bigger as n increases, so a 3s orbital is larger than a 1s orbital.",
69:"Whatever the energy level (from n = 2 upward), there are three p orbitals, px, py and pz, pointing along the three axes.",
70:"Four of the five d orbitals look like four-lobed clover leaves. The fifth, dz², looks like a p orbital with a ring (doughnut) around its middle.",
71:"The f sublevel has 7 orbitals and each holds 2 electrons, so it holds 14 electrons in total.",
72:"The d sublevel has 5 orbitals with 2 electrons each, so it holds 10 electrons. That is why the transition-metal block is ten elements wide.",
73:"Each orbital, shown as a box, holds at most two electrons, and they must have opposite spins. This is the basis of the Pauli exclusion principle.",
74:"Within the same energy level, orbital energy rises in the order s < p < d < f. This is why s electrons fill first, then p, then d.",
75:"Orbitals with the same energy are called degenerate. In hydrogen, with only one electron, all orbitals of the same n have the same energy.",
76:"With many electrons, the electrons repel each other and shield the nucleus from one another. This changes the energy of each subshell, so s, p and d orbitals of the same n are no longer equal in energy.",
77:"After 3p⁶ the next level is 4s, not 3d. The 4s subshell has slightly lower energy than 3d in the filling order, which is why K and Ca fill 4s before the 3d metals.",
78:"In an orbital diagram, each orbital is drawn as a box (or line) and each electron as an arrow. Arrow direction shows spin (up or down).",
79:"Aufbau means 'building up'. Electrons fill the lowest-energy orbitals first and then move to higher ones, as the atom is most stable in its ground state.",
80:"Hund's rule: when orbitals have equal energy, electrons go one into each box first, all with the same spin, and pair up only after every box has one. This keeps repulsion low.",
81:"Pauli's principle says no two electrons in an atom can have all four quantum numbers the same. In one orbital the two electrons must therefore have opposite spins.",
82:"Nitrogen's three 2p electrons go into three separate 2p boxes with parallel spins, following Hund's rule. They do not pair up, so nitrogen has 3 unpaired electrons.",
83:"Chlorine's 3p⁵ fills two boxes completely and puts one electron in the third box. That is one unpaired electron, which is why chlorine readily forms one bond.",
84:"Beryllium has 4 electrons: 2 in 1s and 2 in 2s. So both the 1s and 2s boxes are full, and 2p is empty.",
85:"Potassium has 19 electrons. After the argon core (18 electrons) the last one goes into 4s, so its configuration is [Ar] 4s¹.",
86:"Titanium has 22 electrons. After the argon core, 4s fills with 2 electrons and the other 2 go in 3d, giving [Ar] 3d² 4s².",
87:"When transition metals form ions, the 4s electrons are lost before the 3d electrons. Fe(II) therefore loses its two 4s electrons and becomes [Ar] 3d⁶.",
88:"In 1s² the 1 is the energy level, the s is the sublevel and the superscript 2 is how many electrons are in that sublevel. Helium has two electrons.",
89:"An electron configuration works like an address. It tells you the level, the sublevel and the number of electrons, so you can locate each electron.",
90:"Oxygen has 8 electrons: 2 in 1s, 2 in 2s and 4 in 2p, so 1s² 2s² 2p⁴. The other options give the wrong total (13, 5 or 8 in the wrong order).",
91:"Iron has 26 electrons. After 3p⁶ (18 electrons), 4s² fills first and then 3d⁶, so the configuration is 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶. The other choices have the wrong electron total or fill orbitals in the wrong order.",
92:"For d-block elements the d electrons are in the shell one below the period. For example, titanium is in period 4 and its d electrons are 3d.",
93:"Neon has 10 electrons: 2 in 1s, 2 in 2s and 6 in 2p. This completely filled second shell makes neon a stable noble gas.",
94:"Scandium has 21 electrons. After [Ar] (18), 4s takes 2 and the last one goes into 3d, giving [Ar] 3d¹ 4s².",
95:"Fluorine has 9 electrons: 2 in 1s, 2 in 2s and 5 in 2p. With one vacancy in 2p, it easily gains one electron to become F⁻.",
96:"[Xe] 6s² means two electrons beyond the xenon core in the sixth period, which is barium (Ba) in Group 2A. Cs would be 6s¹, and Ra would be [Rn] 7s².",
97:"The outermost shell is the valence shell and its electrons are the valence electrons. They are the ones that take part in bonding and reactions.",
98:"A full outer shell usually holds 8 electrons (the octet), which is 2 in s and 6 in p. Hydrogen and helium are the exception because the first shell holds only 2 electrons.",
99:"Oxygen's valence shell is n = 2: 2s² plus 2p⁴ gives 6 valence electrons.",
100:"Sulfur's valence shell is n = 3: 3s² plus 3p⁴ gives 6 valence electrons. It is in the same group as oxygen, so the count is the same.",
101:"Valence electrons follow the group number: thallium is in Group 3A (3), xenon in Group 8A (8) and rubidium in Group 1A (1).",
102:"In 1829 Johann Döbereiner noticed that some elements fall naturally into groups of three, called triads, where the middle element has properties and an atomic mass between the other two.",
103:"The Döbereiner triads are Li–Na–K, Ca–Sr–Ba, S–Se–Te and Cl–Br–I. C, N and O are neighbours in a period but do not make a triad of similar elements.",
104:"John Newlands (1864) linked the chemical properties of elements to their atomic masses. He arranged the known elements by increasing mass and found a repeating pattern, which he called the law of octaves.",
105:"Starting from lithium and counting up by mass, Newlands found that every eighth element repeated the properties of the first, like the eighth note repeats in a musical scale.",
106:"Newlands compared his pattern to the notes in a musical scale, where every eighth note is the same note one octave higher, hence 'law of octaves'.",
107:"The pattern only worked for the lighter elements. Newlands forced every element into groups of eight, even where the pattern broke down, and this made many elements land beside ones with unlike properties.",
108:"In 1869 Mendeleev arranged the elements by increasing atomic mass and put elements with similar chemical behaviour into the same column. Atomic number was not yet known.",
109:"Mendeleev left gaps for elements that had not yet been found, instead of forcing every element in. He predicted that undiscovered elements would fit into those spaces, and some predictions (such as gallium and germanium) came true.",
110:"The slide says Mendeleev grouped 66 elements by their properties and predicted the properties of elements not yet discovered.",
111:"Mendeleev's table was ordered by atomic mass, but a few elements (for example Te and I) had to be placed out of mass order to keep similar elements together. This was a flaw.",
112:"In 1913 Henry Moseley used X-ray frequencies to show that the number of protons (atomic number), not mass, is the true basis of order. This fixed the mass-order problem.",
113:"The modern table is arranged by atomic number, the number of protons. This is the modern periodic law: properties repeat periodically with atomic number.",
114:"The vertical columns of the table are called groups or families. Elements in a group have the same number of valence electrons, so they behave similarly. Rows are periods.",
115:"Elements in the same group share similar valence electron configurations, and that is why their chemistry is alike. Mass, colour and density vary down a group and do not link them.",
116:"There are two numbering styles: the older one uses 1–8 with letters A and B (1A, 2A, 3B and so on) and the newer IUPAC one numbers the groups 1–18. The older style shows the valence electron count more directly.",
117:"The main-group (representative) elements are the A groups, 1A to 7A, along with the noble gases in 8A in many tables. The B groups are the transition metals and the f-block are inner transition metals.",
118:"Noble gases have a full outer shell with the configuration ns²np⁶, an octet. Helium is the exception, with 1s², because the first shell holds only two electrons.",
119:"Transition elements are filling their d orbitals, so they make up the d block. The s block is Groups 1A and 2A and the p block is Groups 3A to 8A.",
120:"The lanthanides (4f) and actinides (5f) are filling f orbitals, so they form the f block, drawn as two rows below the main table.",
121:"Sodium has 11 electrons: 1s² 2s² 2p⁶ 3s¹. In short form this is [Ne]3s¹, the neon core plus one outer electron.",
122:"Francium is in Group 1A, period 7, so it has one outer electron on top of the radon core: [Rn]7s¹.",
123:"Group 1A are the alkali metals and each has a single valence electron (ns¹), which they lose easily to form +1 ions.",
124:"Alkali metals have low ionization energy, since their single outer electron is easily removed. Being so reactive, they never occur as free elements in nature, only in compounds.",
125:"Alkali metals combine with oxygen to make oxides (such as Li₂O), and some make peroxides (Na₂O₂) or superoxides (KO₂). They don't make acids with oxygen.",
126:"Group 2A has two valence electrons (ns²). They are called alkaline earth metals and form +2 ions.",
127:"Group 2A is less reactive than Group 1A, because two electrons are lost instead of one, and the metals are smaller and denser. Reactivity increases down the group as the outer electrons are held more loosely.",
128:"Reactive metals such as Mg and Ca react with water or acid and displace hydrogen, producing H₂ gas, for example Mg + 2HCl → MgCl₂ + H₂.",
129:"Group 3A all have three valence electrons (ns² np¹). For boron this is 2s² 2p¹, and the same pattern follows down the group.",
130:"Boron is a metalloid (between metals and non-metals), while Al, Ga, In and Tl below it are metals.",
131:"Aluminium burns in oxygen to form Al₂O₃ and in acid it forms Al³⁺ ions. It gives up three valence electrons, so the oxide is Al₂O₃ and not AlO.",
132:"The other Group 3A metals (Ga, In, Tl) form +1 and +3 ions. The +1 state becomes more common down the group, as the ns² pair is held more tightly (the 'inert pair effect').",
133:"Thallium has 81 electrons. Its configuration after the xenon core is 6s² 4f¹⁴ 5d¹⁰ 6p¹. The 6p¹ is its single p electron, which matches Group 3A.",
134:"Group 4A (Group 14) has four valence electrons (ns² np²). Carbon is 2s² 2p², silicon 3s² 3p² and so on down the group.",
135:"In Group 4A, carbon is a non-metal, silicon and germanium are metalloids, and tin and lead are metals. The group runs from non-metal to metal going down.",
136:"Group 4A elements show +2 and +4 oxidation states. Down the group the +2 state becomes more stable, so Sn and Pb react with acid to give H₂ and a +2 ion.",
137:"Group 5A (Group 15) has five valence electrons (ns² np³). Nitrogen and phosphorus are non-metals, As and Sb are metalloids and Bi is a metal.",
138:"Nitric acid (HNO₃) from nitrogen and phosphoric acid (H₃PO₄) from phosphorus are major industrial chemicals, used for fertilizers and explosives. HCl and H₂SO₄ come from Groups 7A and 6A.",
139:"Group 6A (Group 16), the oxygen family, has six valence electrons (ns² np⁴). O, S and Se are non-metals, Te is a metalloid and Po is a metal. (The slide also lists Se as a metalloid.)",
140:"The slide lists O₂, S₈ and Se₈ as elements of Group 6A, and compounds such as SO₂, SO₃, H₂S and H₂SO₄. N₂ and P₄ are from Group 5A, and F₂ and Cl₂ from Group 7A.",
141:"Halogens (Group 7A) have seven valence electrons (ns² np⁵). All are reactive non-metals that exist as diatomic molecules such as F₂, Cl₂, Br₂ and I₂.",
142:"Halogens are so reactive that they are never free in nature. They are found as halide ions in ionic 'salts' such as NaCl, and they form molecular compounds with each other (for example ICl).",
143:"Noble gases are monatomic, which means they exist as single atoms, and they have filled valence shells (ns² np⁶), so they are stable and rarely react.",
144:"Noble gases were thought to be completely inert until the early 1960s, when xenon and krypton compounds were made. The slide gives 1963. Bartlett's first xenon compound was reported in 1962.",
145:"The slide says the noble gases have no major commercial use. (In practice helium and argon are used for balloons, welding and lighting, but this is not what the slide states.)",
146:"Transition metals fill their d orbitals. Because of the partly filled d subshell, they show several oxidation states and form coloured compounds and complexes.",
147:"The lanthanides fill the 4f orbitals and the actinides fill the 5f orbitals. They make up the f block.",
148:"Atomic radius is the distance from an atom's nucleus to its valence shell, the outer edge of the electron cloud. Since there is no sharp edge, it is measured indirectly from distances between nuclei.",
149:"For metals, the radius is taken as half of the distance between the nuclei of two touching, identical atoms in a crystal. Half is used because the full distance spans two atoms.",
150:"Covalent radius is half the distance between the nuclei of two identical atoms joined by a covalent bond, for example half the Cl–Cl bond length in Cl₂.",
151:"The distance between a cation and an anion in an ionic crystal is split between the two ions to give each ion's radius. So ionic radius comes from a cation–anion pair.",
152:"The positions of nuclei in a crystal can be found by X-ray crystallography, which shows how X-rays are scattered by the atoms. Titration, chromatography and distillation are for measuring amounts or separating mixtures.",
153:"Across a period the nuclear charge rises, but electrons are added to the same shell, so shielding barely increases. The valence electrons feel a stronger pull and the atom shrinks.",
154:"Each step down a group adds a new shell farther from the nucleus. This outweighs the increased nuclear charge, so the radius grows.",
155:"Going down a group, n rises by one each time, so the outer electrons sit in bigger shells farther away, and the covalent radius increases.",
156:"Zeff is the net pull a particular electron feels from the nucleus after other electrons have cancelled part of it. It is less than the full nuclear charge.",
157:"Hydrogen has just one electron and so nothing can shield it. The nuclear charge Z (1) and Zeff are equal. In atoms with more electrons, inner electrons shield outer ones.",
158:"Zeff = Z − S, the nuclear charge minus the shielding. For example, sodium has Z = 11 and the 10 inner electrons shield most of this, so its outer electron feels a small Zeff.",
159:"Shielding depends on how likely it is that other electrons lie between the electron of interest and the nucleus. Electrons that spend time between them screen the nucleus.",
160:"Core electrons lie directly between the nucleus and the valence electrons, so they shield best. Electrons in the same shell shield each other only a little.",
161:"Moving right, each atom gains a proton but the added electron is in the same shell and shields little. Zeff rises, and the electrons are pulled closer, so the radius falls.",
162:"Valence electrons are the highest in energy, are shielded by all the inner electrons and are farthest from the nucleus. These factors make them the easiest to remove.",
163:"The slide gives s > d > p. Many textbooks give s > p > d, because s electrons penetrate closest to the nucleus. The warning on the slide flags this mismatch. For the exam, use the slide's wording.",
164:"Down a group the number of shielding inner electrons grows, and the valence electrons are further out. Zeff felt by the outer electrons is lowered.",
165:"Radius grows down a group (so Ge < Fl, whose position is below Ge) and shrinks across a period (so Kr < Br < Ge, all in period 4). The result is Kr < Br < Ge < Fl.",
166:"Here Fl is flerovium, element 114 in Group 4A below Pb, and not fluorine (F). Reading it as fluorine is the trap in this example.",
167:"When a cation forms, the atom loses its outer electrons and often a whole shell. The same number of protons then pulls fewer electrons, so the ion is smaller.",
168:"An anion has gained electrons but not protons. More electron repulsion with the same nuclear pull makes the cloud expand, so the anion is bigger than its atom.",
169:"With the valence electrons gone, the remaining core electrons feel a greater Zeff and are pulled in tighter, so the cation is smaller than the atom.",
170:"V³⁺ (64 pm) is smaller than V²⁺ (79 pm). A higher positive charge means more protons relative to electrons, so a tighter pull and a smaller ion.",
171:"The added electrons repel each other more, and the number of protons does not change, so Zeff per electron is lower. The electron cloud swells and the anion is larger.",
172:"Atoms and ions with the same electron configuration are isoelectronic. Isotopes differ in neutrons, isomers in structure and isobars in mass number.",
173:"N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺ and Al³⁺ all have 10 electrons in 1s² 2s² 2p⁶. The other lists have different electron counts.",
174:"[Ne]3s² 3p⁶ means 18 electrons. P³⁻, S²⁻, Cl⁻, Ar, K⁺, Ca²⁺ and Sc³⁺ all have 18, so they form the isoelectronic series.",
175:"With the same number of electrons, the more protons an ion has, the stronger its pull on them. A greater nuclear charge gives a smaller radius.",
176:"All five ions have 10 electrons. The ion with the fewest protons is largest, so N³⁻ (7 protons) > O²⁻ (8) > F⁻ (9) > Na⁺ (11) > Mg²⁺ (12).",
177:"N³⁻ has 10 electrons and only 7 protons, a ratio of 1.43. It has the highest electron-to-proton ratio, so the weakest pull per electron and the largest size.",
178:"IE₁ is the energy needed to pull the most loosely bound electron off a gaseous atom, forming a +1 ion. Adding an electron is electron affinity instead.",
179:"Removing the second electron is the second ionization energy (IE₂), the third is IE₃, and so on. Lattice energy and bond energy are different.",
180:"Pulling an electron away from the nucleus always needs energy, so ionization is endothermic and IE values are positive.",
181:"In a big atom the outermost electron is far from the nucleus and well shielded, so it is held weakly and is easy to remove.",
182:"IE₁ rises across a period (more Zeff, smaller atoms) and falls down a group (larger atoms, more shielding). That is why Cs gives up its electron far more easily than Li.",
183:"Beryllium loses a 2s electron, while boron loses its lone 2p electron. A 2p electron sits higher in energy and is shielded by the 2s electrons, so it is removed more easily despite boron's extra proton.",
184:"Across a period Zeff increases, the atoms shrink and the outer electrons are held more tightly. So IE₁ generally rises.",
185:"Down a group the outer electron is in a shell farther away and is more shielded, so it is easier to remove. The distance effect wins over the added protons.",
186:"From Group 2A (ns²) to 3A (ns²np¹) the energy drops, because the electron to remove is now in a higher-energy p subshell, which is easier to remove than an s electron.",
187:"There is a drop from 5A to 6A. The slide says 5A has a 'filled stable' p configuration; to be exact it is half-filled (p³). In 6A (p⁴) one p orbital has a pair, and the repulsion makes that electron easier to remove.",
188:"After the first electron is removed, the remaining electrons feel the same nucleus with less repulsion, so each next electron costs more energy. Removing core electrons costs far more.",
189:"Core electrons are close to the nucleus and are barely shielded, so they feel a strong Zeff. This makes them very hard to remove.",
190:"A cation has a positive charge, so pulling a negatively charged electron away fights greater electrostatic attraction than for a neutral atom.",
191:"Tl’s 6p¹ electron is far away, so IE₁(Tl) is lowest, then IE₁(Al) from 3p¹. IE₃(Al) removes an electron from a 2+ ion, which is harder, and IE₂(Na) removes a core electron from Na⁺, the highest. Order: IE₁(Tl) < IE₁(Al) < IE₃(Al) < IE₂(Na).",
192:"Electron affinity is the energy change when a gaseous atom takes up one electron. Removing an electron is ionization energy instead.",
193:"When chlorine gains an electron, energy is released, about 349 kJ/mol, so ΔH is negative. The slide also gives −348 kJ/mol elsewhere, as these are rounding differences.",
194:"A negative EA means energy is released when the atom accepts an electron. For some elements energy must be put in and the EA is positive.",
195:"The second electron affinity refers to adding an electron to an anion, forming a 2− ion. Because the ion repels the new electron, it needs energy and is positive.",
196:"Across a period Zeff rises, so the atom attracts the extra electron more. EA values become more negative, meaning more energy is released.",
197:"The slide lists Groups 2A, 5A and 8A as exceptions to the trend, because their configurations are stable (filled s, half-filled p or full shell).",
198:"Group 2A has a completely filled ns subshell, so the added electron has to go into a higher-energy np orbital. That makes EA less favourable than the trend predicts.",
199:"Group 5A has a half-filled np subshell, where each orbital holds one electron. The added electron must pair up in an orbital that already holds an electron, causing repulsion.",
200:"Noble gases have completely filled shells, so a new electron has to go into the next shell up, at a higher energy and farther away. That is not favourable.",
201:"In these groups the electron configuration is unusually stable at the start, so changing it costs more. This breaks the smooth trend.",
202:"By the trend, the element at the top has the highest Zeff and the smallest radius, so it should attract an extra electron the most. In reality the first member is often an exception, as the next question shows.",
203:"The second element, such as chlorine in Group 7A, usually has the greatest EA. The first member's small n = 2 shell crowds the incoming electron.",
204:"Fluorine's EA is about −322 kJ/mol. It is less negative than chlorine's because its small 2p subshell is crowded and the incoming electron is repelled by those already there.",
205:"Chlorine has the most negative EA in the periodic table, −348 kJ/mol (about 349 elsewhere). Fluorine is lower because of electron crowding in n = 2.",
206:"Chlorine's incoming electron goes into the n = 3 shell, a larger region of space. There is less repulsion, so more energy is released than with fluorine.",
207:"Fluorine gives off energy when it gains an electron but needs a huge amount to lose one. So it forms fluoride anions much more easily than cations.",
208:"Chemical behaviour is controlled by the arrangement of outer electrons. Group IA has ns¹, IIA has ns² and IVA has ns²np², and these different configurations lead to the different trends in reactivity and ionization energy. Mass, colour and density do not explain this.",
209:"Group IA (Li, Na, K, Rb, Cs, Fr) all have one electron in the outer shell (ns¹). Losing it gives a +1 ion, which is why they react so readily.",
210:"Reactivity increases down Group IA, because the outer electron is farther from the nucleus and more shielded, so it is lost more easily. Potassium reacts with water more violently than sodium or lithium.",
211:"IA atoms have just one electron outside a stable core, and it is held weakly. A very small amount of energy removes it, giving low ionization energy.",
212:"Potassium has 19 electrons: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹, which counts as 2, 8, 8, 1 across shells. (2, 8, 1 is sodium.)",
213:"Rubidium has 37 electrons, [Kr]5s¹. Shell by shell the count is 2, 8, 18, 8 and then 1 in the fifth shell.",
214:"Caesium has 55 electrons, [Xe]6s¹. Shell by shell, 2, 8, 18, 18, 8, 1.",
215:"Francium has 87 electrons, [Rn]7s¹. Shell by shell, 2, 8, 18, 32, 18, 8, 1.",
216:"Alkali metals react with oxygen (oxides, peroxides, superoxides), halogens (halides), nitrogen (nitrides), hydrogen (hydrides) and sulphur (sulphides). They do not form carbonates or acids directly.",
217:"Lithium is the only alkali metal that combines directly with nitrogen, forming Li₃N. The other alkali metals do not react with nitrogen under normal conditions.",
218:"Alkali metals tarnish quickly by reacting with oxygen and moisture in air, and the heavier ones can catch fire. So they are stored under paraffin, an inert liquid or an inert gas.",
219:"Calcium, strontium and barium oxides dissolve in water to give alkaline solutions, which gives the group its name. Beryllium is the exception, since its oxide and hydroxide are amphoteric, not strongly basic.",
220:"IIA atoms have two outer electrons and a higher nuclear charge, so their first ionization energy is higher than that of IA but still low compared with most elements. They react with water and acids, and more so down the group.",
221:"Be and Mg are covered by a thin, tough, stable oxide layer that stops further reaction. This passivating film lets them be stored in dry air.",
222:"Ca, Sr and Ba are more reactive, so they have to be stored under mineral oil, in an inert atmosphere, or sealed in airtight containers, to keep out oxygen and moisture.",
223:"An inert gas such as argon does not react with the metal, and it keeps oxygen away. Oxygen, chlorine and steam would all react with it.",
224:"Group IIA configurations are Be [He]2s², Mg [Ne]3s², Ca [Ar]4s², Sr [Kr]5s², Ba [Xe]6s² and Ra [Rn]7s². So Sr is [Kr]5s² and Ra is [Rn]7s².",
225:"Flerovium (Fl, element 114) is a synthetic, radioactive element. It exists only briefly, so very little is known about its chemistry. It is not a halogen, a noble gas or a typical metalloid.",
226:"Group IVA elements have four outer electrons (ns²np²). Carbon and silicon are relatively unreactive, while tin and lead are metals with more reactivity.",
227:"The slide explains this by the stability of ns²np², which is how the option is worded. More generally, IVA atoms have a higher nuclear charge and smaller size, so their electrons are held more strongly than those of IA and IIA.",
228:"Germanium has 32 electrons: argon core (18) + 3d¹⁰ + 4s² + 4p². The other options are the configurations of Sn, Si and C.",
229:"Lead has 82 electrons: [Xe] 4f¹⁴ 5d¹⁰ 6s² 6p². Sn is [Kr]4d¹⁰ 5s² 5p², Fl is [Rn]5f¹⁴ 6d¹⁰ 7s² 7p², and Ge is [Ar]3d¹⁰ 4s² 4p².",
230:"Group IA is the most reactive, with the lowest ionization energies, because it has only one weakly held outer electron.",
231:"Reactivity falls IA > IIA > IVA. IA loses one easily-removed electron, IIA must lose two, and IVA holds its four electrons more tightly.",
232:"Group IVA has the highest ionization energies and the lowest reactivity of the three, since four outer electrons are held tightly by the higher nuclear charge.",
233:"IIA ionization energies are moderate, higher than IA but lower than IVA. The extra proton makes each electron slightly harder to remove.",
234:"Reactivity in Group IVA varies widely, from the unreactive non-metal carbon to the metals tin and lead, so no single pattern fits. It is generally lower than that of IA and IIA."

    <p class="meta"><b>How to use:</b> choose one option, then check the answer and the slide explanation under it.</p>
    <p class="meta">⚠ marks a spot where the slide itself has a typo or inconsistency.</p>
    <p class="meta"><b>Note on format:</b> my web search found no openly accessible UI (Ibadan) CHM/COS past papers, so I used the standard Nigerian-university CBT style: a stem with options (A)–(D) and one best answer.</p>
    <div class="card list">
      <button class="btn primary" data-s="-1">All questions <small>${prog(-1, DATA.qs.length)}</small></button>
      ${secs.map((s,i) => `<button class="btn" data-s="${i}">${esc(s.name)} <small>${prog(i, s.qs.length)}</small></button>`).join('')}
    </div>
    <p class="meta"><b>Coverage note:</b> every text line of the slides is covered above. A few slides are pictures only (reactivity series order, extraction flow chart, colour wheel, colours of common complex ions, band-of-stability graphs); I covered what their captions and surrounding text state, but not values that appear only inside images. Section 9 answers lean toward option A, so shuffle the options when you practise. ⚠ Q346: the slide's mass-defect arithmetic does not work out exactly (nucleon mass 236.9845 u minus 235.04393 u is 1.94057 u); I kept its stated 1.915065 u so the answer matches your slide.</p>`;
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const i = +b.dataset.s;
    pool = i < 0 ? DATA.qs.slice() : secs[i].qs.slice();
    title = i < 0 ? 'All questions' : secs[i].name;
    secIdx = i; const sv = loadAll()[i];
    idx = sv && sv.idx < pool.length ? sv.idx : 0; answers = sv && sv.answers ? sv.answers : {}; show();
  });
  window.scrollTo(0,0);
}
function show(){
  const q = pool[idx], a = answers[q.n], done = a !== undefined;
  save();
  app.innerHTML = `
    <div class="top">
      <div class="row"><button class="btn" id="quit" style="padding:6px 12px;min-height:36px">Menu</button><span>${idx+1} / ${pool.length}</span></div>
      <div class="bar"><i style="width:${(idx+(done?1:0))/pool.length*100}%"></i></div>
    </div>
    <div class="card">
      <p class="slide">${esc(q.sec)}</p>
      <p class="qtext"><b>${q.n}.</b> ${esc(q.q)}</p>
      ${q.o.map(([L,t]) => {
        let c = ''; if(done){ if(L === q.a) c = 'ok'; else if(L === a) c = 'bad'; }
        return `<button class="opt ${c}" data-l="${L}" ${done?'disabled':''}><b>(${L})</b><span>${esc(t)}</span></button>`;
      }).join('')}
      ${done ? `<div class="exp"><b class="res ${a===q.a?'ok':'bad'}">${a===q.a?'Correct':'Incorrect'}</b><br><b>Ans: ${q.a}.</b> ${esc(q.e)}${DETAIL[q.n] ? `<p style="margin:10px 0 0"><b>Detailed explanation:</b> ${esc(DETAIL[q.n])}</p>` : ''}</div>` : ''}
    </div>
    <div class="nav">
      <button class="btn" id="prev" ${idx===0?'disabled':''}>Previous</button>
      <button class="btn primary" id="next">${idx===pool.length-1?'Finish':'Next'}</button>
    </div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => { answers[q.n] = b.dataset.l; show(); });
  document.getElementById('prev').onclick = () => { idx--; show(); window.scrollTo(0,0); };
  document.getElementById('next').onclick = () => { if(idx === pool.length-1) results(); else { idx++; show(); window.scrollTo(0,0); } };
  document.getElementById('quit').onclick = () => { home(); };
}
function results(){
  const total = pool.length, right = pool.filter(q => answers[q.n] === q.a).length;
  const wrong = pool.filter(q => answers[q.n] !== undefined && answers[q.n] !== q.a);
  const left = total - pool.filter(q => answers[q.n] !== undefined).length;
  app.innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="card"><div class="score">${right} / ${total}</div><div class="meta">${Math.round(right/total*100)}% · ${left} unanswered</div>
      <div class="nav"><button class="btn primary" id="again">Retake</button><button class="btn" id="home">Menu</button></div></div>
    ${wrong.length ? `<div class="card"><b>Review: incorrect answers (${wrong.length})</b>${wrong.map(q => `
      <div class="rev"><p class="slide">${esc(q.sec)}</p>
        <p style="margin:0 0 6px"><b>${q.n}.</b> ${esc(q.q)}</p>
        <p style="margin:0 0 4px"><span class="tag">Your answer: ${answers[q.n]}</span></p>
        <p style="margin:0"><b>Ans: ${q.a}.</b> ${esc(q.e)}</p>${DETAIL[q.n] ? `<p style="margin:6px 0 0"><b>Detailed explanation:</b> ${esc(DETAIL[q.n])}</p>` : ''}</div>`).join('')}</div>` : ''}`;
  document.getElementById('again').onclick = () => { idx = 0; answers = {}; show(); window.scrollTo(0,0); };
  document.getElementById('home').onclick = home;
  window.scrollTo(0,0);
}
home();
</script></body></html>
